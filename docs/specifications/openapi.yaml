components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The browser session. Writes must also carry an Origin header naming this deployment. API
        tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
      schema: {type: string}
    WorkUnitID:
      name: work_unit_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExternalActionID:
      name: external_action_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    AgentDraft: {type: object, required: [id, name, status, answers, version], properties: {id: {type: string, format: uuid}, name: {type: string}, owner_membership_id: {type: string, format: uuid}, agent_definition_id: {type: [string, "null"], format: uuid}, answers: {type: object, additionalProperties: true}, spec_sha256: {type: [string, "null"]}, status: {type: string, enum: [editing, in_review, published, archived]}, from_pack_installation_id: {type: [string, "null"], format: uuid}, issues: {type: array, items: {type: object, additionalProperties: true}}, risk: {type: array, items: {type: object, additionalProperties: true}}, risk_level: {type: string, enum: [standard, elevated]}, version: {type: integer}, updated_at: {type: string, format: date-time}}}
    ProcessDraft: {type: object, required: [id, name, status, graph, version], properties: {id: {type: string, format: uuid}, name: {type: string}, owner_membership_id: {type: string, format: uuid}, classification: {type: string, enum: [public, internal, confidential, restricted]}, graph: {type: object, additionalProperties: true}, spec_sha256: {type: [string, "null"]}, issues: {type: array, items: {type: object, additionalProperties: true}}, status: {type: string, enum: [editing, in_review, published, archived]}, version: {type: integer}, updated_at: {type: string, format: date-time}}}
    Simulation: {type: object, required: [id, status, subject_sha256, scenario_key], properties: {id: {type: string, format: uuid}, subject_kind: {type: string, enum: [agent_draft, process_draft, bundled_workflow]}, subject_id: {type: [string, "null"], format: uuid}, subject_key: {type: [string, "null"]}, subject_sha256: {type: string}, scenario_key: {type: string}, status: {type: string, enum: [queued, running, passed, failed, errored]}, outcome_code: {type: [string, "null"]}, report: {type: [object, "null"], additionalProperties: true}, created_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}}}
    PublishReview: {type: object, required: [id, status, subject_sha256, risk_level, version], properties: {id: {type: string, format: uuid}, subject_kind: {type: string, enum: [agent_draft, process_draft]}, subject_id: {type: string, format: uuid}, subject_sha256: {type: string}, simulation_run_id: {type: string, format: uuid}, risk_level: {type: string, enum: [standard, elevated]}, risk_summary: {type: array, items: {type: object, additionalProperties: true}}, requested_by_membership_id: {type: string, format: uuid}, reviewer_membership_id: {type: [string, "null"], format: uuid}, status: {type: string, enum: [pending, approved, rejected, cancelled, published]}, decision_reason: {type: [string, "null"]}, published_ref: {type: [string, "null"], format: uuid}, version: {type: integer}, created_at: {type: string, format: date-time}}}
    ProcessSpec: {type: object, required: [id, process_key, version_number, spec_sha256], properties: {id: {type: string, format: uuid}, process_key: {type: string}, version_number: {type: integer}, name: {type: string}, classification: {type: string, enum: [public, internal, confidential, restricted]}, spec: {type: object, additionalProperties: true}, spec_sha256: {type: string}, source: {type: string, enum: [graph, bundled, pack]}, source_ref: {type: [string, "null"]}, published_at: {type: string, format: date-time}}}
    ProcessRun: {type: object, required: [id, status, root_work_unit_id, steps, version], properties: {id: {type: string, format: uuid}, spec_id: {type: string, format: uuid}, process_name: {type: string}, root_work_unit_id: {type: string, format: uuid}, status: {type: string, enum: [queued, running, waiting, completed, failed, cancelled]}, stop_code: {type: [string, "null"]}, steps: {type: array, items: {type: object, additionalProperties: true}}, cost: {type: [object, "null"], additionalProperties: true}, version: {type: integer}, created_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}}}
    ObjectType: {type: object, required: [id, slug, classification, current_version_number, fields, version], properties: {id: {type: string, format: uuid}, slug: {type: string}, display_name: {type: string}, classification: {type: string, enum: [public, internal, confidential, restricted]}, current_version_number: {type: integer}, fields: {type: array, items: {type: object, additionalProperties: true}}, relations: {type: array, items: {type: object, additionalProperties: true}}, state: {type: string, enum: [active, archived]}, version: {type: integer}}}
    ObjectRecord: {type: object, required: [id, type_id, display_name, attributes, classification, version], properties: {id: {type: string, format: uuid}, type_id: {type: string, format: uuid}, type_version_number: {type: integer}, display_name: {type: string}, attributes: {type: object, additionalProperties: true}, classification: {type: string, enum: [public, internal, confidential, restricted]}, owner_membership_id: {type: string, format: uuid}, can_change: {type: boolean}, version: {type: integer}, updated_at: {type: string, format: date-time}}}
    PackCatalogEntry: {type: object, required: [key, version, name], properties: {key: {type: string}, version: {type: string}, name: {type: string}, description: {type: string}, installation: {type: [object, "null"], additionalProperties: true}, upgrade: {type: [object, "null"], additionalProperties: true}}}
    PackInstallation: {type: object, required: [id, pack_key, pack_version, status, capabilities, version], properties: {id: {type: string, format: uuid}, pack_key: {type: string}, pack_version: {type: string}, manifest_sha256: {type: string}, status: {type: string, enum: [reviewing, active, superseded, rolled_back, cancelled]}, capabilities: {type: array, items: {type: object, additionalProperties: true}}, items: {type: array, items: {type: object, additionalProperties: true}}, version: {type: integer}}}
    CompanyPulse: {type: object, required: [generated_at, signals, summary, partial], properties: {generated_at: {type: string, format: date-time}, signals: {type: array, items: {$ref: '#/components/schemas/PulseSignal'}}, summary: {type: object, additionalProperties: true}, partial: {type: array, items: {type: string}}}}
    PulseSignal: {type: object, required: [key, kind, severity, evidence, since, personal_state], properties: {key: {type: string}, kind: {type: string}, severity: {type: string, enum: [attention, watch]}, scope: {type: object, additionalProperties: true}, evidence: {type: array, minItems: 1, items: {type: object, additionalProperties: true}}, since: {type: string, format: date-time}, personal_state: {type: string, enum: [open, snoozed, dismissed]}, snoozed_until: {type: [string, "null"], format: date-time}}}
    OutcomeDraft: {type: object, required: [id, objective, preview, preview_sha256, status, version], properties: {id: {type: string, format: uuid}, objective: {type: string}, preview: {type: object, additionalProperties: true}, preview_sha256: {type: string}, status: {type: string, enum: [draft, authorized, discarded]}, work_unit_id: {type: [string, "null"], format: uuid}, version: {type: integer}, updated_at: {type: string, format: date-time}}}
    Onboarding: {type: object, required: [steps, finished], properties: {steps: {type: array, items: {type: object, additionalProperties: true}}, finished: {type: boolean}, next: {type: [string, "null"]}}}
    SecurityPolicy: {type: object, required: [mfa_for_administration, mfa_max_age_seconds, sso_enforcement, version], properties: {mfa_for_administration: {type: boolean}, mfa_max_age_seconds: {type: integer}, sso_enforcement: {type: string, enum: [optional, required]}, version: {type: integer}}}
    SsoConnection: {type: object, required: [id, provider_id, domain, domain_state, state, version], properties: {id: {type: string, format: uuid}, provider_id: {type: string}, display_name: {type: string}, domain: {type: string}, domain_state: {type: string, enum: [unverified, verified]}, state: {type: string, enum: [draft, active, disabled]}, auto_join: {type: boolean}, version: {type: integer}}}
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        project_id: {type: [string, 'null'], format: uuid}
        due_at: {type: [string, 'null'], format: date-time}
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists: {type: boolean}
            reviewer_approved: {type: boolean}
    PendingApproval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, status, tool_name, action, action_hash, expires_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        tool_name: {type: string}
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash: {type: string, description: Quote this when deciding.}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    WorkStatus:
      type: string
      enum: [queued, ready, running, blocked, awaiting_approval, verifying, completed, failed, cancelled]
    WorkUnit:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        objective: {type: string}
        status: {$ref: '#/components/schemas/WorkStatus'}
        version: {type: integer, minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
        completion:
          allOf: [{$ref: '#/components/schemas/WorkCompletion'}]
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required: [basis, confirmed_by_membership_id, confirmed_at]
      properties:
        basis:
          type: string
          enum: [evidence, owner_confirmed, not_recorded]
          description: >-
            `evidence` means the Work Unit's criteria were met. `owner_confirmed` means no evidence
            was requested, and the accountable owner confirmed it themselves. `not_recorded` means
            it finished before this was recorded.
        confirmed_by_membership_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: string, format: date-time}
    EmailContent:
      type: object
      additionalProperties: false
      required: [to, subject, text_body]
      description: Plain text, with no attachments. The sender comes from the connection.
      properties:
        to: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: email}}
        cc: {type: array, maxItems: 50, items: {type: string, format: email}}
        bcc: {type: array, maxItems: 50, items: {type: string, format: email}}
        reply_to: {type: string, format: email}
        subject: {type: string, minLength: 1, maxLength: 200}
        text_body: {type: string, minLength: 1, maxLength: 200000}
    ProposeEmailAction:
      type: object
      additionalProperties: false
      required: [connection_id, approver_membership_id, email]
      properties:
        connection_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ReviseEmailAction:
      type: object
      additionalProperties: false
      required: [approver_membership_id, email]
      properties:
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ProposedExternalAction:
      type: object
      additionalProperties: false
      required: [id, approval_id, request_hash, status]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        request_hash: {type: string, description: What the approval binds. It covers every field sent.}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
    ExternalActionStatus:
      type: string
      enum: [awaiting_approval, ready, sending, reconciling, sent, failed, unknown, cancelled]
      description: >-
        `sent` means the provider accepted it, which for email is the mail server taking it and not
        the message reaching an inbox. `failed` means it was not sent. `unknown` means it could have
        gone and the provider cannot say, so it waits for a person and is never sent again by itself.
    ExternalActionSummary:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, status, status_reason, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null'], description: A code from a fixed list. Never provider text.}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExternalActionReceipt:
      type: object
      additionalProperties: false
      required: [outcome, basis, code, provider_status, external_id, actor_name, recorded_at]
      properties:
        outcome: {type: string, enum: [sent, failed, unknown, cancelled]}
        basis:
          type: string
          enum: [provider, reconciliation, person, system]
          description: Whose word this is. `person` is what someone said they found, not a provider's answer.
        code: {type: [string, 'null']}
        provider_status: {type: [integer, 'null']}
        external_id: {type: [string, 'null'], description: For email, the Message-ID to search for.}
        actor_name: {type: [string, 'null']}
        recorded_at: {type: string, format: date-time}
    ExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
        - connection_name
        - payload
        - request_hash
        - approval_id
        - external_id
        - supersedes_id
        - retry_of_id
        - attempt_count
        - receipts
        - resolution
        - resolution_reason
        - resolved_by_name
        - can_resolve
        - can_retry
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        connection_name: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: Exactly what the approval binds. It cannot be changed once created.
        request_hash: {type: string}
        approval_id: {type: [string, 'null'], format: uuid}
        external_id: {type: [string, 'null']}
        supersedes_id: {type: [string, 'null'], format: uuid}
        retry_of_id: {type: [string, 'null'], format: uuid}
        attempt_count: {type: integer, minimum: 0}
        receipts: {type: array, items: {$ref: '#/components/schemas/ExternalActionReceipt'}}
        resolution: {type: [string, 'null'], enum: [confirmed_sent, confirmed_not_sent, null]}
        resolution_reason: {type: [string, 'null']}
        resolved_by_name: {type: [string, 'null']}
        can_resolve: {type: boolean}
        can_retry: {type: boolean}
    Connection:
      type: object
      additionalProperties: false
      required: [id, connector_type, display_name, state, has_credential, last_error_code, version, created_at]
      properties:
        id: {type: string, format: uuid}
        connector_type: {type: string}
        display_name: {type: string}
        state: {type: string, enum: [active, disabled, revoked]}
        has_credential: {type: boolean}
        last_error_code: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, signing_secret, signature_scheme]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: Shown once. It holds the only copy of the token.}
        signing_secret: {type: string, description: Shown once. Only a sealed copy is kept.}
        signature_scheme: {type: string, enum: [ensemus_hmac_sha256_v1]}
    AgentRun:
      type: object
      required: [id, status, agent_version_id, work_unit_id]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        agent_version_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        estimated_cost_usd: {type: [number, 'null']}
        status_url: {type: string}
    ModelProfile:
      type: object
      required: [id, provider, model_id, allowed_classes]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model_id: {type: string}
        allowed_classes: {type: array, items: {type: string}}
        region: {type: [string, 'null']}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
  responses:
    BadRequest:
      description: Malformed path, query, header or body. details.fields names the fields, never their values.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authorization or policy rejection
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Concurrent update, dependency conflict, or an Idempotency-Key reused with a different request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validation:
      description: Input or model/tool compatibility validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Missing or inaccessible resource; avoid existence leaks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: JSON body over the 256 KB limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Body is not application/json
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Something failed on the server. The answer holds no detail about what.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RestorePending:
      description: >-
        This organization's database was restored from a backup and is behind the tombstone ledger,
        so nothing is served until an operator has re-applied the ledger. The code is RESTORE_PENDING,
        the request did nothing, and it can be repeated. Only members of the organization see this.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
