openapi: 3.1.0
info:
  title: Ensemus Canonical API (Reference Contract)
  version: 2.0.0
  description: "Next.js Route Handler reference interface for tenant-aware work, agent, approval,
    search and provider policies. The work-unit routes, and the approval list, read and decision
    routes, are implemented, and accept a browser session cookie, with writes also checked against
    the Origin header. Bearer tokens are not accepted yet. An operation marked x-ensemus-status
    planned is an architectural specification and does not exist yet. Real responses from every
    other operation are validated against this file by tests/stack/api.test.ts, and
    tests/unit/openapi-contract.test.ts keeps the two lists honest. The public webhook address, POST
    /api/webhooks/{token}, is not here: it takes no session, it is not a client API, and it answers
    only 202, 404, 413 and 429 with no body, so a stranger learns nothing (ADR-027 D4)."
servers:
  - url: https://ensemus.example.invalid/api/v1
    description: Illustrative placeholder; not a live endpoint.
security:
  - sessionCookie: []
tags:
  - name: work
  - name: agents
  - name: approvals
  - name: external-actions
  - name: connections
  - name: knowledge
  - name: governance
  - name: models
  - name: commercial
  - name: studio
  - name: objects
  - name: packs
  - name: experience
  - name: identity
paths:
  /organizations/{organization_id}/work-units:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      tags:
        - work
      summary: List permitted Work Units
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WorkStatus"
      responses:
        "200":
          description: Permission-filtered page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkUnit"
                  next_cursor:
                    type:
                      - string
                      - "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
    post:
      tags:
        - work
      summary: Create a Work Unit
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkUnit"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/work-units/{work_unit_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: work_unit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - work
      summary: Read permitted Work Unit
      responses:
        "200":
          description: Work Unit
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
    patch:
      tags:
        - work
      summary: Patch with optimistic version check
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The version last read, as sent in the ETag response header. Weak tags, lists and * are
            refused.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 300
                objective:
                  type: string
                  maxLength: 10000
                due_at:
                  type:
                    - string
                    - "null"
                  format: date-time
      responses:
        "200":
          description: Updated Work Unit
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/work-units/{work_unit_id}/events:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: work_unit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - work
      summary: Follow a Work Unit's version as server-sent events
      description: Sends an event named status whose data and id are both the current version, whenever
        the version differs from the last one sent, and comment heartbeats in between. Status comes
        from PostgreSQL, so a reconnect to any replica resumes from Last-Event-ID. Access is checked
        again on every poll, and the stream ends when access is lost. Connections close after about
        15 minutes, and EventSource reconnects by itself. With include=evidence it also sends an
        event named evidence, with no id, at once and whenever the Work Unit's files or reviews
        change, since those can change without the version moving. Its data is an opaque value to
        compare, and says nothing about them.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The last version received. Without a usable value, the current version is sent at once.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Asks for evidence events as well as status events.
          schema:
            type: string
            enum:
              - evidence
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/work-units/{work_unit_id}/dependencies:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: work_unit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - work
      summary: Add prerequisite, rejecting cycles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prerequisite_id
              additionalProperties: false
              properties:
                prerequisite_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/agent-runs:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    post:
      tags:
        - agents
      summary: Start bounded agent execution on a Work Unit
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentRunRequest"
      responses:
        "202":
          description: Durable run queued. Limits come from the agent version, never the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
    get:
      tags:
        - agents
      summary: List runs on a Work Unit the caller can read
      parameters:
        - name: work_unit_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Runs on this Work Unit
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/agent-runs/{agent_run_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: agent_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - agents
      summary: Read scoped execution progress
      responses:
        "200":
          description: Run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/agent-runs/{agent_run_id}/controls:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: agent_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - agents
      summary: Stop, pause or resume a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunControlRequest"
      responses:
        "202":
          description: Recorded. Each step rechecks this before acting
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/agent-runs/{agent_run_id}/steps:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: agent_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - agents
      summary: Read a run as codes and counters, with no model text
      responses:
        "200":
          description: Steps, oldest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExecutionStep"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/agent-versions:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    post:
      tags:
        - agents
      summary: Publish an immutable agent version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishAgentVersionRequest"
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
    get:
      tags:
        - agents
      summary: List published agent versions
      responses:
        "200":
          description: Published versions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/agent-versions/{agent_version_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: agent_version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - agents
      summary: Read one published agent version
      responses:
        "200":
          description: Version record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/approvals:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      tags:
        - approvals
      summary: Approvals waiting on the caller, soonest first
      responses:
        "200":
          description: Pending approvals the caller can decide
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingApproval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/approvals/{approval_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - approvals
      summary: One approval, with the exact action and the hash a decision must quote
      responses:
        "200":
          description: Approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/approvals/{approval_id}/decisions:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - approvals
      summary: Decide exact immutable proposed action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decision
                - action_hash
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - deny
                action_hash:
                  type: string
                  minLength: 32
                  maxLength: 128
                reason:
                  type: string
                  maxLength: 2000
                  description: Required, and not blank, to deny an approval the work is paused on, because that stops
                    the work for good. Without it the answer is 400 with code REASON_REQUIRED.
      responses:
        "200":
          description: Decision recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/work-units/{work_unit_id}/external-actions:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/WorkUnitID"
    post:
      tags:
        - external-actions
      summary: Propose an email, for a named person to approve exactly as written
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeEmailAction"
      responses:
        "201":
          description: Proposed. Nothing has been sent, and nothing is sent without that approval.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposedExternalAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/external-actions:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      tags:
        - external-actions
      summary: External actions on work the caller can read
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExternalActionStatus"
        - name: work_unit_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Permission-filtered page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalActionSummary"
                  next_cursor:
                    type:
                      - string
                      - "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/external-actions/{external_action_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/ExternalActionID"
    get:
      tags:
        - external-actions
      summary: One external action, with its exact payload and every receipt
      responses:
        "200":
          description: The action. `unknown` means nobody can say whether it was sent.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/external-actions/{external_action_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/ExternalActionID"
    post:
      tags:
        - external-actions
      summary: Change what would be sent. This closes the action and its approval, and asks for a new one
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseEmailAction"
      responses:
        "201":
          description: A new action, waiting for its own approval. The old one can no longer be sent.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposedExternalAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
