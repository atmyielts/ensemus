      - $ref: '#/components/parameters/OrganizationID'
    get:
      tags: [models]
      summary: Read manager-only bounded workload approvals and current evidence availability
      parameters:
        - { name: after, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: At most 50 approvals in UUID order; live call admission still applies
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ModelWorkloadApproval' } }
                  next_cursor: { type: [string, 'null'], format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RestorePending' }
