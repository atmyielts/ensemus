openapi: 3.1.0
info:
  title: Ensemus Canonical API (Reference Contract)
  version: 2.0.0
  description: >-
    Next.js Route Handler reference interface for tenant-aware work, agent, approval, search and provider
    policies. The work-unit routes, and the approval list, read and decision routes, are implemented, and
    accept a browser session cookie, with writes also checked against the Origin header. Bearer tokens are
    not accepted yet. An operation marked x-ensemus-status planned is an architectural specification and
    does not exist yet. Real responses from every other operation are validated against this file by
    tests/stack/api.test.ts, and tests/unit/openapi-contract.test.ts keeps the two lists honest.
servers:
  - url: https://ensemus.example.invalid/api/v1
    description: Illustrative placeholder; not a live endpoint.
security:
  - sessionCookie: []
tags:
  - name: work
  - name: agents
  - name: approvals
  - name: knowledge
  - name: models
  - name: commercial
paths:
  /organizations/{organization_id}/work-units:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      tags: [work]
      summary: List permitted Work Units
      parameters:
        - name: cursor
          in: query
          schema: {type: string, minLength: 1, maxLength: 512}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/WorkStatus'}
      responses:
        '200':
          description: Permission-filtered page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/WorkUnit'}}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [work]
      summary: Create a Work Unit
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkUnit'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkUnit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /organizations/{organization_id}/work-units/{work_unit_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: work_unit_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [work]
      summary: Read permitted Work Unit
      responses:
        '200':
          description: Work Unit
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkUnit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [work]
      summary: Patch with optimistic version check
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                title: {type: string, minLength: 1, maxLength: 300}
                objective: {type: string, maxLength: 10000}
                due_at: {type: [string, 'null'], format: date-time}
      responses:
        '200':
          description: Updated Work Unit
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkUnit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
  /organizations/{organization_id}/work-units/{work_unit_id}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: work_unit_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [work]
      summary: Follow a Work Unit's version as server-sent events
      description: >-
        Sends an event named status whose data and id are both the current version, whenever the version
        differs from the last one sent, and comment heartbeats in between. Status comes from PostgreSQL,
        so a reconnect to any replica resumes from Last-Event-ID. Access is checked again on every poll,
        and the stream ends when access is lost. Connections close after about 15 minutes, and
        EventSource reconnects by itself.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The last version received. Without a usable value, the current version is sent at once.
          schema: {type: string}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /organizations/{organization_id}/work-units/{work_unit_id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: work_unit_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [work]
      summary: Add prerequisite, rejecting cycles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prerequisite_id]
              additionalProperties: false
              properties:
                prerequisite_id: {type: string, format: uuid}
      responses:
        '201': {description: Added}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /organizations/{organization_id}/agent-runs:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      x-ensemus-status: planned
      tags: [agents]
      summary: Start bounded agent execution on a Work Unit
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_unit_id, agent_version_id]
              additionalProperties: false
              properties:
                work_unit_id: {type: string, format: uuid}
                agent_version_id: {type: string, format: uuid}
                max_cost_usd: {type: number, minimum: 0}
      responses:
        '202':
          description: Durable run queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
  /organizations/{organization_id}/agent-runs/{agent_run_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: agent_run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      x-ensemus-status: planned
      tags: [agents]
      summary: Read scoped execution progress
      responses:
        '200':
          description: Run record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organization_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      tags: [approvals]
      summary: Approvals waiting on the caller, soonest first
      responses:
        '200':
          description: Pending approvals the caller can decide
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PendingApproval'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /organizations/{organization_id}/approvals/{approval_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: approval_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [approvals]
      summary: One approval, with the exact action and the hash a decision must quote
      responses:
        '200':
          description: Approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /organizations/{organization_id}/approvals/{approval_id}/decisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: approval_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [approvals]
      summary: Decide exact immutable proposed action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, action_hash]
              properties:
                decision: {type: string, enum: [approve, deny]}
                action_hash: {type: string, minLength: 32, maxLength: 128}
                reason: {type: string, maxLength: 2000}
      responses:
        '200': {description: Decision recorded}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /organizations/{organization_id}/knowledge/search:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      x-ensemus-status: planned
      tags: [knowledge]
      summary: Search authorized knowledge with citations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 4000}
                limit: {type: integer, minimum: 1, maximum: 50, default: 10}
                allowed_source_ids:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: Permission-filtered results
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [source_id, excerpt, source_version]
                      properties:
                        source_id: {type: string, format: uuid}
                        source_version: {type: string}
                        excerpt: {type: string}
                        citation_ref: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organizations/{organization_id}/model-profiles:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [models]
      summary: List authorized provider profiles without secrets
      responses:
        '200':
          description: Approved model profile metadata only
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles: {type: array, items: {$ref: '#/components/schemas/ModelProfile'}}
  /organizations/{organization_id}/entitlements:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Read current commercial mode, features, and quotas
      responses:
        '200':
          description: Entitlements (no license private keys)
          content:
            application/json:
              schema:
                type: object
                required: [mode, features]
                properties:
                  mode: {type: string, enum: [cloud, byom, sovereign]}
                  features: {type: array, items: {type: string}}
                  capacity: {type: object, additionalProperties: true}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The browser session. Writes must also carry an Origin header naming this deployment. API
        tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
  schemas:
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        project_id: {type: [string, 'null'], format: uuid}
        due_at: {type: [string, 'null'], format: date-time}
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists: {type: boolean}
            reviewer_approved: {type: boolean}
    PendingApproval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, status, tool_name, action, action_hash, expires_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        tool_name: {type: string}
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash: {type: string, description: Quote this when deciding.}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    WorkStatus:
      type: string
      enum: [queued, ready, running, blocked, awaiting_approval, verifying, completed, failed, cancelled]
    WorkUnit:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        objective: {type: string}
        status: {$ref: '#/components/schemas/WorkStatus'}
        version: {type: integer, minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
        completion:
          allOf: [{$ref: '#/components/schemas/WorkCompletion'}]
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required: [basis, confirmed_by_membership_id, confirmed_at]
      properties:
        basis:
          type: string
          enum: [evidence, owner_confirmed, not_recorded]
          description: >-
            `evidence` means the Work Unit's criteria were met. `owner_confirmed` means no evidence
            was requested, and the accountable owner confirmed it themselves. `not_recorded` means
            it finished before this was recorded.
        confirmed_by_membership_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: string, format: date-time}
    AgentRun:
      type: object
      required: [id, status, agent_version_id, work_unit_id]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        agent_version_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        estimated_cost_usd: {type: [number, 'null']}
        status_url: {type: string}
    ModelProfile:
      type: object
      required: [id, provider, model_id, allowed_classes]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model_id: {type: string}
        allowed_classes: {type: array, items: {type: string}}
        region: {type: [string, 'null']}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
  responses:
    BadRequest:
      description: Malformed path, query, header or body. details.fields names the fields, never their values.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authorization or policy rejection
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Concurrent update, dependency conflict, or an Idempotency-Key reused with a different request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validation:
      description: Input or model/tool compatibility validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Missing or inaccessible resource; avoid existence leaks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: JSON body over the 256 KB limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Body is not application/json
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Something failed on the server. The answer holds no detail about what.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
