                  profiles: {type: array, items: {$ref: '#/components/schemas/ModelProfile'}}
  /organizations/{organization_id}/entitlements:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Read current commercial mode, features, and quotas
      responses:
        '200':
          description: Entitlements (no license private keys)
          content:
            application/json:
              schema:
                type: object
                required: [mode, features]
                properties:
                  mode: {type: string, enum: [cloud, byom, sovereign]}
                  features: {type: array, items: {type: string}}
                  capacity: {type: object, additionalProperties: true}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The browser session. Writes must also carry an Origin header naming this deployment. API
        tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
      schema: {type: string}
    WorkUnitID:
      name: work_unit_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExternalActionID:
      name: external_action_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SourceID:
      name: source_id
      in: path
      required: true
      description: A source the caller's ACL does not cover answers as if it did not exist.
      schema: {type: string, format: uuid}
  schemas:
    KnowledgeGrant:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, membership_id]
          properties:
            kind: {type: string, const: membership}
            membership_id: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [kind, team_id]
          properties:
            kind: {type: string, const: team}
            team_id: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {type: string, const: organization}
    KnowledgeSource:
      type: object
      additionalProperties: false
      required: [id, kind, state, classification, title, can_read, document_state, embedding_state, searchable_at, source_modified_at, version, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [upload, connector]}
        state: {type: string, enum: [active, revoked, deleted]}
        classification: {type: string, enum: [public, internal, confidential, restricted]}
        title:
          type: [string, 'null']
          description: Null when the caller's ACL does not cover it.
        can_read: {type: boolean}
        document_state:
          type: [string, 'null']
          enum: [received, parsing, searchable, rejected, failed, purged, null]
        embedding_state:
          type: [string, 'null']
          enum: [pending, embedding, embedded, denied, failed, null]
        searchable_at: {type: [string, 'null'], format: date-time}
        source_modified_at: {type: [string, 'null'], format: date-time}
        scan_state:
          type: [string, 'null']
          enum: [not_scanned, clean, flagged, null]
          description: No scanner ships, and `not_scanned` says so.
        reject_code: {type: [string, 'null']}
        source_url: {type: [string, 'null'], format: uri}
        grants_managed_by_provider: {type: boolean}
        version: {type: integer}
        created_at: {type: string, format: date-time}
    KnowledgePurge:
      type: object
      additionalProperties: false
      required: [source_id, reason, state, counts, requested_at, completed_at, last_error_code]
      properties:
        source_id: {type: string, format: uuid}
        reason: {type: string, enum: [deleted, revoked, connection_revoked, resource_gone, restore_reapply]}
        state: {type: string, enum: [pending, running, completed, failed]}
        counts:
          type: object
          additionalProperties: false
          required: [documents, chunks, embeddings, facts, answers, blobs]
          properties:
            documents: {type: integer}
            chunks: {type: integer}
            embeddings: {type: integer}
            facts: {type: integer}
            answers: {type: integer}
            blobs: {type: integer}
        requested_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        last_error_code: {type: [string, 'null']}
    KnowledgePassage:
      type: object
      additionalProperties: false
      required: [chunk_id, document_id, source_id, excerpt, title, classification, source_version, source_url, source_modified_at]
      properties:
        chunk_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        source_id: {type: string, format: uuid}
        excerpt: {type: string}
        title: {type: string}
        classification: {type: string, enum: [public, internal, confidential, restricted]}
        source_version: {type: [string, 'null']}
        source_url: {type: [string, 'null'], format: uri}
        source_modified_at: {type: [string, 'null'], format: date-time}
    KnowledgeAnswer:
      type: object
      additionalProperties: false
      required: [id, state, question, answer_text, refusal_code, citations, strongest_classification, cost_micros, created_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [queued, running, answered, no_evidence, refused, failed]}
        question: {type: string}
        answer_text: {type: [string, 'null']}
        refusal_code: {type: [string, 'null']}
        citations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ordinal, answer_start, answer_end, document_id, source_id, title, excerpt, source_version, source_url, source_modified_at, freshness]
            properties:
              ordinal: {type: integer}
              answer_start: {type: integer}
              answer_end: {type: integer}
              document_id: {type: string, format: uuid}
              source_id: {type: string, format: uuid}
              title: {type: string}
              excerpt: {type: string}
              source_version: {type: [string, 'null']}
              source_url: {type: [string, 'null'], format: uri}
              source_modified_at: {type: [string, 'null'], format: date-time}
              freshness: {type: string, enum: [current, superseded]}
        strongest_classification:
          type: [string, 'null']
          enum: [public, internal, confidential, restricted, null]
        cost_micros:
          type: [integer, 'null']
          description: An estimate, in micro-USD. Null when the model's profile has no rate card.
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    KnowledgeFact:
      type: object
      additionalProperties: false
      required: [id, subject_ref, predicate, claim, trust_state, origin, classification, conflict_ref, evidence, version, created_at]
      properties:
        id: {type: string, format: uuid}
        subject_ref: {type: string}
        predicate: {type: string}
        claim: {}
        trust_state: {type: string, enum: [proposed, verified, disputed, superseded, rejected]}
        origin: {type: string, enum: [model, person]}
        classification: {type: string, enum: [public, internal, confidential, restricted]}
        conflict_ref: {type: [string, 'null']}
        reviewed_by_membership_id: {type: [string, 'null'], format: uuid}
        reviewed_at: {type: [string, 'null'], format: date-time}
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [chunk_id, document_id, source_id, title, excerpt, stale]
            properties:
              chunk_id: {type: string, format: uuid}
              document_id: {type: string, format: uuid}
              source_id: {type: string, format: uuid}
              title: {type: string}
              excerpt: {type: string}
              stale: {type: boolean}
        version: {type: integer}
        created_at: {type: string, format: date-time}
    GraphNode:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [client, project, membership, team, work_unit, knowledge_source]}
        id: {type: string, format: uuid}
    EgressLedgerEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, source, purpose, data_class, model_profile_ref, provider_kind, destination_host, decision, reason_code, policy_version, request_sha256, run_id]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        source: {type: string, enum: [knowledge, agent_run]}
        purpose: {type: string}
        data_class: {type: string, enum: [public, internal, confidential, restricted]}
        model_profile_ref: {type: [string, 'null'], format: uuid}
        provider_kind: {type: [string, 'null']}
        destination_host: {type: [string, 'null']}
        decision: {type: string, enum: [allow, deny]}
        reason_code: {type: string}
        policy_version: {type: string}
        request_sha256: {type: [string, 'null']}
        run_id: {type: [string, 'null'], format: uuid}
    McpTool:
      type: object
      additionalProperties: false
      required: [id, connection_id, tool_name, definition, definition_sha256, status, side_effect_level, allowed_classes, reviewed_at, version]
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        tool_name: {type: string}
        definition: {description: "The server's own words, shown as such."}
        definition_sha256: {type: string}
        status: {type: string, enum: [pending_review, approved, rejected, removed]}
        side_effect_level:
          type: [string, 'null']
          enum: [read_only, external_write, null]
        allowed_classes:
          type: array
          items: {type: string, enum: [public, internal, confidential]}
        reviewed_at: {type: [string, 'null'], format: date-time}
        version: {type: integer}
    ArtifactVerification:
      type: object
      additionalProperties: false
      required: [artifact_id, artifact_sha256, grounding, human, citations]
      properties:
        artifact_id: {type: string, format: uuid}
        artifact_sha256: {type: string}
        grounding:
          type: [object, 'null']
          required: [verdict, reason_code, at]
          properties:
            verdict: {type: string, enum: [passed, failed]}
            reason_code: {type: [string, 'null']}
            at: {type: string, format: date-time}
        human:
          type: [object, 'null']
          required: [verdict, by, reason, at]
          properties:
            verdict: {type: string, enum: [accepted, rejected]}
            by: {type: string, format: uuid}
            reason: {type: [string, 'null']}
            at: {type: string, format: date-time}
        citations:
          type: array
          items:
            type: object
            required: [ordinal, document_id, source_id, title, excerpt, available]
            properties:
              ordinal: {type: integer}
              document_id: {type: string, format: uuid}
              source_id: {type: string, format: uuid}
              title: {type: [string, 'null']}
              excerpt: {type: [string, 'null']}
              available: {type: boolean}
    ClientOnboarding:
      type: object
      additionalProperties: false
      required: [id, deal_ref, state, state_code, client_id, project_id, work_unit_id, cost_micros, receipt, version, created_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        deal_ref: {type: string}
        state: {type: string, enum: [started, waiting_for_brief, waiting_for_acceptance, waiting_for_send, completed, failed, unknown]}
        state_code: {type: [string, 'null']}
        client_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        cost_micros:
          type: [integer, 'null']
          description: An estimate, in micro-USD, from the usage ledger.
        receipt:
          type: [object, 'null']
          required: [status, external_id]
          properties:
            status: {type: string}
            external_id: {type: [string, 'null']}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        project_id: {type: [string, 'null'], format: uuid}
        due_at: {type: [string, 'null'], format: date-time}
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists: {type: boolean}
            reviewer_approved: {type: boolean}
    PendingApproval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, status, tool_name, action, action_hash, expires_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        tool_name: {type: string}
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash: {type: string, description: Quote this when deciding.}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    WorkStatus:
      type: string
      enum: [queued, ready, running, blocked, awaiting_approval, verifying, completed, failed, cancelled]
    WorkUnit:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        objective: {type: string}
        status: {$ref: '#/components/schemas/WorkStatus'}
        version: {type: integer, minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
        completion:
          allOf: [{$ref: '#/components/schemas/WorkCompletion'}]
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required: [basis, confirmed_by_membership_id, confirmed_at]
      properties:
        basis:
          type: string
          enum: [evidence, owner_confirmed, not_recorded]
          description: >-
            `evidence` means the Work Unit's criteria were met. `owner_confirmed` means no evidence
            was requested, and the accountable owner confirmed it themselves. `not_recorded` means
            it finished before this was recorded.
        confirmed_by_membership_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: string, format: date-time}
    EmailContent:
      type: object
      additionalProperties: false
      required: [to, subject, text_body]
      description: Plain text, with no attachments. The sender comes from the connection.
      properties:
        to: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: email}}
        cc: {type: array, maxItems: 50, items: {type: string, format: email}}
        bcc: {type: array, maxItems: 50, items: {type: string, format: email}}
        reply_to: {type: string, format: email}
        subject: {type: string, minLength: 1, maxLength: 200}
        text_body: {type: string, minLength: 1, maxLength: 200000}
    ProposeEmailAction:
      type: object
      additionalProperties: false
      required: [connection_id, approver_membership_id, email]
      properties:
        connection_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ReviseEmailAction:
      type: object
      additionalProperties: false
      required: [approver_membership_id, email]
      properties:
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ProposedExternalAction:
      type: object
      additionalProperties: false
      required: [id, approval_id, request_hash, status]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        request_hash: {type: string, description: What the approval binds. It covers every field sent.}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
    ExternalActionStatus:
      type: string
      enum: [awaiting_approval, ready, sending, reconciling, sent, failed, unknown, cancelled]
      description: >-
        `sent` means the provider accepted it, which for email is the mail server taking it and not
        the message reaching an inbox. `failed` means it was not sent. `unknown` means it could have
        gone and the provider cannot say, so it waits for a person and is never sent again by itself.
    ExternalActionSummary:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, status, status_reason, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null'], description: A code from a fixed list. Never provider text.}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExternalActionReceipt:
      type: object
      additionalProperties: false
      required: [outcome, basis, code, provider_status, external_id, actor_name, recorded_at]
      properties:
        outcome: {type: string, enum: [sent, failed, unknown, cancelled]}
        basis:
          type: string
          enum: [provider, reconciliation, person, system]
          description: Whose word this is. `person` is what someone said they found, not a provider's answer.
        code: {type: [string, 'null']}
        provider_status: {type: [integer, 'null']}
        external_id: {type: [string, 'null'], description: For email, the Message-ID to search for.}
        actor_name: {type: [string, 'null']}
        recorded_at: {type: string, format: date-time}
    ExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
        - connection_name
        - payload
        - request_hash
        - approval_id
        - external_id
        - supersedes_id
        - retry_of_id
        - attempt_count
        - receipts
        - resolution
        - resolution_reason
        - resolved_by_name
        - can_resolve
        - can_retry
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        connection_name: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: Exactly what the approval binds. It cannot be changed once created.
        request_hash: {type: string}
        approval_id: {type: [string, 'null'], format: uuid}
        external_id: {type: [string, 'null']}
        supersedes_id: {type: [string, 'null'], format: uuid}
        retry_of_id: {type: [string, 'null'], format: uuid}
        attempt_count: {type: integer, minimum: 0}
        receipts: {type: array, items: {$ref: '#/components/schemas/ExternalActionReceipt'}}
        resolution: {type: [string, 'null'], enum: [confirmed_sent, confirmed_not_sent, null]}
        resolution_reason: {type: [string, 'null']}
        resolved_by_name: {type: [string, 'null']}
        can_resolve: {type: boolean}
        can_retry: {type: boolean}
    Connection:
      type: object
      additionalProperties: false
      required: [id, connector_type, display_name, state, has_credential, last_error_code, version, created_at]
      properties:
        id: {type: string, format: uuid}
        connector_type: {type: string}
        display_name: {type: string}
        state: {type: string, enum: [active, disabled, revoked]}
        has_credential: {type: boolean}
        last_error_code: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, signing_secret, signature_scheme]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: Shown once. It holds the only copy of the token.}
        signing_secret: {type: string, description: Shown once. Only a sealed copy is kept.}
        signature_scheme: {type: string, enum: [ensemus_hmac_sha256_v1]}
    AgentRun:
      type: object
      required: [id, status, agent_version_id, work_unit_id]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        agent_version_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        estimated_cost_usd: {type: [number, 'null']}
        status_url: {type: string}
    ModelProfile:
      type: object
      required: [id, provider, model_id, allowed_classes]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model_id: {type: string}
        allowed_classes: {type: array, items: {type: string}}
        region: {type: [string, 'null']}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
  responses:
    BadRequest:
      description: Malformed path, query, header or body. details.fields names the fields, never their values.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authorization or policy rejection
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Concurrent update, dependency conflict, or an Idempotency-Key reused with a different request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validation:
      description: Input or model/tool compatibility validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Missing or inaccessible resource; avoid existence leaks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: JSON body over the 256 KB limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Body is not application/json
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Something failed on the server. The answer holds no detail about what.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RestorePending:
      description: >-
        This organization's database was restored from a backup and is behind the tombstone ledger,
        so nothing is served until an operator has re-applied the ledger. The code is RESTORE_PENDING,
        the request did nothing, and it can be repeated. Only members of the organization see this.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
