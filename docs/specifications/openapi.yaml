        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [ knowledge ]
      summary: Read the caller's durable model job and freshly authorized query result
      responses:
        '200':
          description: Current state. Private query text and model receipts are excluded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeModelJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RestorePending' }
