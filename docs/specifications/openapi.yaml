    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: model_profile_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [models]
      summary: Read manager-only capability evidence, including stale versions and unknown outcomes
      parameters:
        - { name: after, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: At most 50 content-free evidence records in UUID order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ModelCapabilityEvidence' } }
                  next_cursor: { type: [string, 'null'], format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RestorePending' }
    post:
      tags: [models]
      summary: Queue one bounded synthetic capability qualification for the exact profile version
      description: Native interactive identity, tenant required-SSO and model_profile.activate privilege are checked in the effect transaction. This HTTP process has no paid model transport. The worker derives the exact purpose protocol; text probe success cannot substitute for capability qualification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestModelCapabilityQualification' }
      responses:
        '202':
          description: Durable request recorded; no qualification granted yet
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [qualification_id, job_id]
                properties:
                  qualification_id: { type: string, format: uuid }
                  job_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RestorePending' }
