      - $ref: '#/components/parameters/ParticipantID'
    delete:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Take someone off the list. Refused once they have answered, or once notes exist
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '204': {description: Removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meetings/{meeting_id}/participants/{participant_id}/consent:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingID'
      - $ref: '#/components/parameters/ParticipantID'
    post:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Record one person's answer. A withdrawal removes everything this meeting produced, at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, notice_ref]
              properties:
                decision: {type: string, enum: [granted, declined, withdrawn]}
                notice_ref: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Where consent now stands
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [consent, status]
                properties:
                  consent: {$ref: '#/components/schemas/MeetingConsentState'}
                  status: {type: string, enum: [open, purged]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meetings/{meeting_id}/notes:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingID'
    post:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Add notes as text. Refused until everyone listed has agreed. A correction is a new version
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 524288}
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, version]
                properties:
                  id: {type: string, format: uuid}
                  version: {type: integer, minimum: 1}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meetings/{meeting_id}/notes-import:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingID'
    post:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Read the notes from their source. Needs everyone's agreement and an approved connection
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_approval_id]
              properties:
                provider_approval_id: {type: string, format: uuid}
      responses:
        '202':
          description: Asked for, and read in the background
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingImportRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meetings/{meeting_id}/derivations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingID'
    get:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Runs asked for on this meeting, and how each ended
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/MeetingDerivation'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
    post:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Ask one approved provider to summarize the notes or suggest items. Nothing it says is applied
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, provider_approval_id]
              properties:
                purpose: {type: string, enum: [summarize, extract_items]}
                provider_approval_id: {type: string, format: uuid}
      responses:
        '202':
          description: Asked for, and run in the background
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingDerivation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meetings/{meeting_id}/summaries:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingID'
    get:
      x-ensemus-status: planned
      tags: [meetings]
      summary: What a model made of the notes. Always marked as that, and never a fact
      responses:
        '200':
          description: Summaries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/MeetingSummaryText'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meetings/{meeting_id}/proposed-items:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingID'
    get:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Decisions and work a model suggests. Nothing here exists until a person says so
      responses:
        '200':
          description: Proposals
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/MeetingProposedItem'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meeting-items/{item_id}/work:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingItemID'
    post:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Accept proposed work. This is the only way one becomes a Work Unit, and it takes a person
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, owner_membership_id, due_at]
              properties:
                title: {type: string, minLength: 1, maxLength: 300}
                objective: {type: string, maxLength: 10000}
                owner_membership_id: {type: string, format: uuid}
                due_at: {type: [string, 'null'], format: date-time}
      responses:
        '201':
          description: The Work Unit this made
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [work_unit_id, version]
                properties:
                  work_unit_id: {type: string, format: uuid}
                  version: {type: integer, minimum: 1}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meeting-items/{item_id}/decision:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingItemID'
    post:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Record a proposed decision as made. It stays with the meeting and starts no work
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecideMeetingItem'}
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionOnly'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/meeting-items/{item_id}/rejection:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MeetingItemID'
    post:
      x-ensemus-status: planned
      tags: [meetings]
      summary: Say a proposal is wrong or not wanted
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecideMeetingItem'}
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionOnly'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The browser session. Writes must also carry an Origin header naming this deployment. API
        tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
      schema: {type: string}
    WorkUnitID:
      name: work_unit_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExternalActionID:
      name: external_action_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordID:
      name: record_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MeetingID:
      name: meeting_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ParticipantID:
      name: participant_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MeetingItemID:
      name: item_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        project_id: {type: [string, 'null'], format: uuid}
        due_at: {type: [string, 'null'], format: date-time}
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists: {type: boolean}
            reviewer_approved: {type: boolean}
    PendingApproval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, status, tool_name, action, action_hash, expires_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        tool_name: {type: string}
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash: {type: string, description: Quote this when deciding.}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    WorkStatus:
      type: string
      enum: [queued, ready, running, blocked, awaiting_approval, verifying, completed, failed, cancelled]
    WorkUnit:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        objective: {type: string}
        status: {$ref: '#/components/schemas/WorkStatus'}
        version: {type: integer, minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
        completion:
          allOf: [{$ref: '#/components/schemas/WorkCompletion'}]
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required: [basis, confirmed_by_membership_id, confirmed_at]
      properties:
        basis:
          type: string
          enum: [evidence, owner_confirmed, not_recorded]
          description: >-
            `evidence` means the Work Unit's criteria were met. `owner_confirmed` means no evidence
            was requested, and the accountable owner confirmed it themselves. `not_recorded` means
            it finished before this was recorded.
        confirmed_by_membership_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: string, format: date-time}
    EmailContent:
      type: object
      additionalProperties: false
      required: [to, subject, text_body]
      description: Plain text, with no attachments. The sender comes from the connection.
      properties:
        to: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: email}}
        cc: {type: array, maxItems: 50, items: {type: string, format: email}}
        bcc: {type: array, maxItems: 50, items: {type: string, format: email}}
        reply_to: {type: string, format: email}
        subject: {type: string, minLength: 1, maxLength: 200}
        text_body: {type: string, minLength: 1, maxLength: 200000}
    ProposeEmailAction:
      type: object
      additionalProperties: false
      required: [connection_id, approver_membership_id, email]
      properties:
        connection_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ReviseEmailAction:
      type: object
      additionalProperties: false
      required: [approver_membership_id, email]
      properties:
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ProposedExternalAction:
      type: object
      additionalProperties: false
      required: [id, approval_id, request_hash, status]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        request_hash: {type: string, description: What the approval binds. It covers every field sent.}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
    ExternalActionStatus:
      type: string
      enum: [awaiting_approval, ready, sending, reconciling, sent, failed, unknown, cancelled]
      description: >-
        `sent` means the provider accepted it, which for email is the mail server taking it and not
        the message reaching an inbox. `failed` means it was not sent. `unknown` means it could have
        gone and the provider cannot say, so it waits for a person and is never sent again by itself.
    ExternalActionSummary:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, status, status_reason, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null'], description: A code from a fixed list. Never provider text.}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExternalActionReceipt:
      type: object
      additionalProperties: false
      required: [outcome, basis, code, provider_status, external_id, actor_name, recorded_at]
      properties:
        outcome: {type: string, enum: [sent, failed, unknown, cancelled]}
        basis:
          type: string
          enum: [provider, reconciliation, person, system]
          description: Whose word this is. `person` is what someone said they found, not a provider's answer.
        code: {type: [string, 'null']}
        provider_status: {type: [integer, 'null']}
        external_id: {type: [string, 'null'], description: For email, the Message-ID to search for.}
        actor_name: {type: [string, 'null']}
        recorded_at: {type: string, format: date-time}
    ExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
        - connection_name
        - payload
        - request_hash
        - approval_id
        - external_id
        - supersedes_id
        - retry_of_id
        - attempt_count
        - receipts
        - resolution
        - resolution_reason
        - resolved_by_name
        - can_resolve
        - can_retry
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        connection_name: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: Exactly what the approval binds. It cannot be changed once created.
        request_hash: {type: string}
        approval_id: {type: [string, 'null'], format: uuid}
        external_id: {type: [string, 'null']}
        supersedes_id: {type: [string, 'null'], format: uuid}
        retry_of_id: {type: [string, 'null'], format: uuid}
        attempt_count: {type: integer, minimum: 0}
        receipts: {type: array, items: {$ref: '#/components/schemas/ExternalActionReceipt'}}
        resolution: {type: [string, 'null'], enum: [confirmed_sent, confirmed_not_sent, null]}
        resolution_reason: {type: [string, 'null']}
        resolved_by_name: {type: [string, 'null']}
        can_resolve: {type: boolean}
        can_retry: {type: boolean}
    Connection:
      type: object
      additionalProperties: false
      required: [id, connector_type, display_name, state, has_credential, last_error_code, version, created_at]
      properties:
        id: {type: string, format: uuid}
        connector_type: {type: string}
        display_name: {type: string}
        state: {type: string, enum: [active, disabled, revoked]}
        has_credential: {type: boolean}
        last_error_code: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, signing_secret, signature_scheme]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: Shown once. It holds the only copy of the token.}
        signing_secret: {type: string, description: Shown once. Only a sealed copy is kept.}
        signature_scheme: {type: string, enum: [ensemus_hmac_sha256_v1]}
    AgentRun:
      type: object
      required: [id, status, agent_version_id, work_unit_id]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        agent_version_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        estimated_cost_usd: {type: [number, 'null']}
        status_url: {type: string}
    ModelProfile:
      type: object
      required: [id, provider, model_id, allowed_classes]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model_id: {type: string}
        allowed_classes: {type: array, items: {type: string}}
        region: {type: [string, 'null']}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
    Classification:
      type: string
      enum: [public, internal, confidential, restricted]
    VersionOnly:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
    BusinessRecord:
      type: object
      additionalProperties: false
      required: [id, connection_id, stream, external_id, external_version, display_name, classification, fields, updated_at]
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        stream: {type: string}
        external_id: {type: string}
        external_version: {type: [string, 'null'], description: Send this back when proposing a change, so nobody changes what they did not see.}
        display_name: {type: [string, 'null']}
        classification: {$ref: '#/components/schemas/Classification'}
        fields:
          type: object
          description: Only the fields this stream keeps, as last read from the source. The source stays authoritative.
          additionalProperties: {type: [string, number, boolean, 'null']}
        updated_at: {type: string, format: date-time}
    ProposeRecordUpdate:
      type: object
      additionalProperties: false
      required: [work_unit_id, approver_membership_id, expected_version, changes]
      properties:
        work_unit_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        expected_version: {type: [string, 'null'], minLength: 1, maxLength: 1024}
        changes:
          type: object
          minProperties: 1
          description: Writable fields of this stream, and no others.
          additionalProperties: {type: [string, number, boolean, 'null']}
    ProposeInvoiceDraft:
      type: object
      additionalProperties: false
      required: [work_unit_id, connection_id, approver_membership_id, invoice]
      properties:
        work_unit_id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        invoice:
          type: object
          additionalProperties: false
          required: [customer_ref, currency, lines]
          description: A draft for a person in the accounting system. It has no status and no payment field.
          properties:
            customer_ref: {type: string, minLength: 1, maxLength: 200}
            currency: {type: string, pattern: '^[A-Z]{3}$'}
            due_on: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
            reference: {type: string, minLength: 1, maxLength: 200}
            memo: {type: string, minLength: 1, maxLength: 1000}
            lines:
              type: array
              minItems: 1
              maxItems: 200
              items:
                type: object
                additionalProperties: false
                required: [description, quantity, unit_price]
                properties:
                  description: {type: string, minLength: 1, maxLength: 500}
                  quantity: {type: string, pattern: '^-?\d{1,18}(\.\d{1,6})?$'}
                  unit_price: {type: string, pattern: '^-?\d{1,18}(\.\d{1,6})?$'}
    MeetingSettings:
      type: object
      additionalProperties: false
      required: [enabled, notice_ref, version]
      properties:
        enabled: {type: boolean}
        notice_ref:
          type: [string, 'null']
          description: Which version of the organization's own notice is current. A reference, and never its text.
        version: {type: integer, minimum: 1}
    MeetingProviderApproval:
      type: object
      additionalProperties: false
      required: [id, kind, target_ref, purposes, max_classification, terms_ref, approved_by_membership_id, approved_at, expires_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [model, source]}
        target_ref: {type: string}
        purposes:
          type: array
          items: {type: string, enum: [import_notes, summarize, extract_items]}
        max_classification: {type: string, enum: [public, internal, confidential]}
        terms_ref: {type: string, description: A reference to the organization's own record of the basis. It holds no terms.}
        approved_by_membership_id: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    ApproveMeetingProvider:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, model_profile_id, purposes, max_classification, terms_ref, expires_at]
          properties:
            kind: {type: string, const: model}
            model_profile_id: {type: string, format: uuid}
            purposes:
              type: array
              minItems: 1
              maxItems: 2
              items: {type: string, enum: [summarize, extract_items]}
            max_classification: {type: string, enum: [public, internal, confidential]}
            terms_ref: {type: string, minLength: 1, maxLength: 200}
            expires_at: {type: string, format: date-time}
        - type: object
          additionalProperties: false
          required: [kind, connection_id, max_classification, terms_ref, expires_at]
          properties:
            kind: {type: string, const: source}
            connection_id: {type: string, format: uuid}
            max_classification: {type: string, enum: [public, internal, confidential]}
            terms_ref: {type: string, minLength: 1, maxLength: 200}
            expires_at: {type: string, format: date-time}
    MeetingConsentState:
      type: string
      enum: [none_listed, pending, complete, refused, withdrawn]
      description: >-
        `complete` means everyone listed has said yes. One no is `refused`, and nothing can go ahead. One
        withdrawal after a yes is `withdrawn`, and everything the meeting produced has gone.
    MeetingSummary:
      type: object
      additionalProperties: false
      required: [id, title, occurred_at, organizer_membership_id, classification, status, source_kind, consent, version]
      properties:
        id: {type: string, format: uuid}
        title: {type: [string, 'null'], description: Null for an owner or admin who was not there.}
        occurred_at: {type: string, format: date-time}
        organizer_membership_id: {type: string, format: uuid}
        classification: {$ref: '#/components/schemas/Classification'}
        status: {type: string, enum: [open, purged]}
        source_kind: {type: string, enum: [manual, connector]}
        consent: {$ref: '#/components/schemas/MeetingConsentState'}
        version: {type: integer, minimum: 1}
    MeetingParticipant:
      type: object
      additionalProperties: false
      required: [id, kind, membership_id, display_name, decision, basis, decided_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [member, external]}
        membership_id: {type: [string, 'null'], format: uuid}
        display_name: {type: string}
        decision: {type: [string, 'null'], enum: [granted, declined, withdrawn, null]}
        basis:
          type: [string, 'null']
          enum: [self, attested, null]
          description: Whose word it is. `attested` is the organizer saying what someone outside said.
        decided_at: {type: [string, 'null'], format: date-time}
    AddMeetingParticipant:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, membership_id]
          properties:
            kind: {type: string, const: member}
            membership_id: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [kind, label]
          properties:
            kind: {type: string, const: external}
            label: {type: string, minLength: 1, maxLength: 200}
    Meeting:
      allOf:
        - {$ref: '#/components/schemas/MeetingSummary'}
      type: object
      required: [participants, current_notes]
      properties:
        participants: {type: array, items: {$ref: '#/components/schemas/MeetingParticipant'}}
        current_notes:
          type: [object, 'null']
          description: Null for an owner or admin who was not there, and when no notes exist.
          additionalProperties: false
          required: [id, version, text, created_at]
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, minimum: 1}
            text: {type: [string, 'null'], description: Null once consent has been withdrawn.}
            created_at: {type: string, format: date-time}
    MeetingImportRequest:
      type: object
      additionalProperties: false
      required: [id, meeting_id, status, status_code, created_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        meeting_id: {type: string, format: uuid}
        status: {type: string, enum: [requested, completed, failed, refused]}
        status_code: {type: [string, 'null'], description: A code from a fixed list. Never provider text.}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    MeetingDerivation:
      type: object
      additionalProperties: false
      required: [id, meeting_id, purpose, status, status_code, requested_by_membership_id, created_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        meeting_id: {type: string, format: uuid}
        purpose: {type: string, enum: [summarize, extract_items]}
        status: {type: string, enum: [requested, running, completed, failed, refused, cancelled]}
        status_code: {type: [string, 'null'], description: A code from a fixed list. Never model text.}
        requested_by_membership_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    MeetingSummaryText:
      type: object
      additionalProperties: false
      required: [id, run_id, text, trust, created_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        text: {type: [string, 'null'], description: Null once consent has been withdrawn.}
        trust: {type: string, const: model_generated}
        created_at: {type: string, format: date-time}
    MeetingProposedItem:
      type: object
      additionalProperties: false
      required: [id, meeting_id, kind, title, detail, suggested_owner_membership_id, suggested_due_on, status, decided_by_membership_id, decided_at, work_unit_id, version]
      properties:
        id: {type: string, format: uuid}
        meeting_id: {type: string, format: uuid}
        kind: {type: string, enum: [decision, work]}
        title: {type: [string, 'null'], description: Null once consent has been withdrawn.}
        detail: {type: [string, 'null']}
        suggested_owner_membership_id: {type: [string, 'null'], format: uuid, description: A suggestion. It assigns nothing.}
        suggested_due_on: {type: [string, 'null']}
        status: {type: string, enum: [proposed, accepted, rejected, withdrawn]}
        decided_by_membership_id: {type: [string, 'null'], format: uuid}
        decided_at: {type: [string, 'null'], format: date-time}
        work_unit_id: {type: [string, 'null'], format: uuid}
        version: {type: integer, minimum: 1}
    DecideMeetingItem:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
  responses:
    BadRequest:
      description: Malformed path, query, header or body. details.fields names the fields, never their values.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authorization or policy rejection
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Concurrent update, dependency conflict, or an Idempotency-Key reused with a different request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validation:
      description: Input or model/tool compatibility validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Missing or inaccessible resource; avoid existence leaks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: JSON body over the 256 KB limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Body is not application/json
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Something failed on the server. The answer holds no detail about what.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RestorePending:
      description: >-
        This organization's database was restored from a backup and is behind the tombstone ledger,
        so nothing is served until an operator has re-applied the ledger. The code is RESTORE_PENDING,
        the request did nothing, and it can be repeated. Only members of the organization see this.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
