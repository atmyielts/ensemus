  /organizations/{organization_id}/support/break-glass:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Requests for support access to content. The default is none.
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/BreakGlassRequest'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/support/break-glass/{break_glass_id}/decision:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/BreakGlassID'
    post:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Agree to or refuse a request. Agreeing still grants no read path in this release.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecideBreakGlass'}
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BreakGlassRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The browser session. Writes must also carry an Origin header naming this deployment. API
        tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
      schema: {type: string}
    WorkUnitID:
      name: work_unit_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExternalActionID:
      name: external_action_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    InvoiceID:
      name: invoice_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LegalHoldID:
      name: legal_hold_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TicketID:
      name: ticket_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    BreakGlassID:
      name: break_glass_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        project_id: {type: [string, 'null'], format: uuid}
        due_at: {type: [string, 'null'], format: date-time}
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists: {type: boolean}
            reviewer_approved: {type: boolean}
    PendingApproval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, status, tool_name, action, action_hash, expires_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        tool_name: {type: string}
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash: {type: string, description: Quote this when deciding.}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    WorkStatus:
      type: string
      enum: [queued, ready, running, blocked, awaiting_approval, verifying, completed, failed, cancelled]
    WorkUnit:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        objective: {type: string}
        status: {$ref: '#/components/schemas/WorkStatus'}
        version: {type: integer, minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
        completion:
          allOf: [{$ref: '#/components/schemas/WorkCompletion'}]
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required: [basis, confirmed_by_membership_id, confirmed_at]
      properties:
        basis:
          type: string
          enum: [evidence, owner_confirmed, not_recorded]
          description: >-
            `evidence` means the Work Unit's criteria were met. `owner_confirmed` means no evidence
            was requested, and the accountable owner confirmed it themselves. `not_recorded` means
            it finished before this was recorded.
        confirmed_by_membership_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: string, format: date-time}
    EmailContent:
      type: object
      additionalProperties: false
      required: [to, subject, text_body]
      description: Plain text, with no attachments. The sender comes from the connection.
      properties:
        to: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: email}}
        cc: {type: array, maxItems: 50, items: {type: string, format: email}}
        bcc: {type: array, maxItems: 50, items: {type: string, format: email}}
        reply_to: {type: string, format: email}
        subject: {type: string, minLength: 1, maxLength: 200}
        text_body: {type: string, minLength: 1, maxLength: 200000}
    ProposeEmailAction:
      type: object
      additionalProperties: false
      required: [connection_id, approver_membership_id, email]
      properties:
        connection_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ReviseEmailAction:
      type: object
      additionalProperties: false
      required: [approver_membership_id, email]
      properties:
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ProposedExternalAction:
      type: object
      additionalProperties: false
      required: [id, approval_id, request_hash, status]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        request_hash: {type: string, description: What the approval binds. It covers every field sent.}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
    ExternalActionStatus:
      type: string
      enum: [awaiting_approval, ready, sending, reconciling, sent, failed, unknown, cancelled]
      description: >-
        `sent` means the provider accepted it, which for email is the mail server taking it and not
        the message reaching an inbox. `failed` means it was not sent. `unknown` means it could have
        gone and the provider cannot say, so it waits for a person and is never sent again by itself.
    ExternalActionSummary:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, status, status_reason, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null'], description: A code from a fixed list. Never provider text.}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExternalActionReceipt:
      type: object
      additionalProperties: false
      required: [outcome, basis, code, provider_status, external_id, actor_name, recorded_at]
      properties:
        outcome: {type: string, enum: [sent, failed, unknown, cancelled]}
        basis:
          type: string
          enum: [provider, reconciliation, person, system]
          description: Whose word this is. `person` is what someone said they found, not a provider's answer.
        code: {type: [string, 'null']}
        provider_status: {type: [integer, 'null']}
        external_id: {type: [string, 'null'], description: For email, the Message-ID to search for.}
        actor_name: {type: [string, 'null']}
        recorded_at: {type: string, format: date-time}
    ExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
        - connection_name
        - payload
        - request_hash
        - approval_id
        - external_id
        - supersedes_id
        - retry_of_id
        - attempt_count
        - receipts
        - resolution
        - resolution_reason
        - resolved_by_name
        - can_resolve
        - can_retry
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        connection_name: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: Exactly what the approval binds. It cannot be changed once created.
        request_hash: {type: string}
        approval_id: {type: [string, 'null'], format: uuid}
        external_id: {type: [string, 'null']}
        supersedes_id: {type: [string, 'null'], format: uuid}
        retry_of_id: {type: [string, 'null'], format: uuid}
        attempt_count: {type: integer, minimum: 0}
        receipts: {type: array, items: {$ref: '#/components/schemas/ExternalActionReceipt'}}
        resolution: {type: [string, 'null'], enum: [confirmed_sent, confirmed_not_sent, null]}
        resolution_reason: {type: [string, 'null']}
        resolved_by_name: {type: [string, 'null']}
        can_resolve: {type: boolean}
        can_retry: {type: boolean}
    Connection:
      type: object
      additionalProperties: false
      required: [id, connector_type, display_name, state, has_credential, last_error_code, version, created_at]
      properties:
        id: {type: string, format: uuid}
        connector_type: {type: string}
        display_name: {type: string}
        state: {type: string, enum: [active, disabled, revoked]}
        has_credential: {type: boolean}
        last_error_code: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, signing_secret, signature_scheme]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: Shown once. It holds the only copy of the token.}
        signing_secret: {type: string, description: Shown once. Only a sealed copy is kept.}
        signature_scheme: {type: string, enum: [ensemus_hmac_sha256_v1]}
    AgentRun:
      type: object
      required: [id, status, agent_version_id, work_unit_id]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        agent_version_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        estimated_cost_usd: {type: [number, 'null']}
        status_url: {type: string}
    ModelProfile:
      type: object
      required: [id, provider, model_id, allowed_classes]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model_id: {type: string}
        allowed_classes: {type: array, items: {type: string}}
        region: {type: [string, 'null']}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
    MicrosAmount:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Whole millionths of a currency's main unit or of a credit, as digits, because JSON numbers cannot hold every value.
    SavedVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
    ReasonCode:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
    BillingAccount:
      type: object
      additionalProperties: false
      required: [billing_name, billing_email, country_code, region_code, postal_code, tax_id, version]
      properties:
        billing_name: {type: string}
        billing_email: {type: string}
        country_code: {type: string, pattern: '^[A-Z]{2}$'}
        region_code: {type: string}
        postal_code: {type: [string, 'null']}
        tax_id: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
    SaveBillingAccount:
      type: object
      additionalProperties: false
      required: [billing_name, billing_email, country_code, region_code, postal_code, tax_id]
      properties:
        billing_name: {type: string, minLength: 1, maxLength: 200}
        billing_email: {type: string, format: email, maxLength: 254}
        country_code: {type: string, pattern: '^[A-Z]{2}$'}
        region_code: {type: string, pattern: '^[A-Z0-9-]{0,16}$'}
        postal_code: {type: [string, 'null'], minLength: 1, maxLength: 32}
        tax_id: {type: [string, 'null'], minLength: 1, maxLength: 64}
    BillingOverview:
      type: object
      additionalProperties: false
      required: [lifecycle, billing_enabled, account, subscription]
      properties:
        lifecycle: {type: string, enum: [active, read_only, suspended, offboarding]}
        billing_enabled: {type: boolean}
        account:
          oneOf:
            - {$ref: '#/components/schemas/BillingAccount'}
            - {type: 'null'}
        subscription:
          oneOf:
            - {$ref: '#/components/schemas/Subscription'}
            - {type: 'null'}
    Subscription:
      type: object
      additionalProperties: false
      required: [id, plan_version_id, status, current_period_start, current_period_end, cancel_at_period_end, version]
      properties:
        id: {type: string, format: uuid}
        plan_version_id: {type: string, format: uuid}
        status: {type: string, enum: [active, past_due, canceled]}
        current_period_start: {type: string, format: date-time}
        current_period_end: {type: string, format: date-time}
        cancel_at_period_end: {type: boolean}
        version: {type: integer, minimum: 1}
    PlanVersion:
      type: object
      additionalProperties: false
      required: [plan_version_id, plan_code, display_name, currency, billing_interval, payment_terms_days, platform_fee_micros, included_microcredits, overage_policy, features, max_active_members]
      properties:
        plan_version_id: {type: string, format: uuid}
        plan_code: {type: string}
        display_name: {type: string}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        billing_interval: {type: string, enum: [month, year]}
        payment_terms_days: {type: integer, minimum: 0}
        platform_fee_micros: {$ref: '#/components/schemas/MicrosAmount'}
        included_microcredits:
          oneOf:
            - {$ref: '#/components/schemas/MicrosAmount'}
            - {type: 'null'}
        overage_policy: {type: [string, 'null'], enum: [pause, explicit_top_up, null]}
        features: {type: array, items: {type: string}}
        max_active_members: {type: [integer, 'null'], minimum: 1}
    PlanChoice:
      type: object
      additionalProperties: false
      required: [plan_version_id]
      properties:
        plan_version_id: {type: string, format: uuid}
    InvoiceStatus:
      type: string
      enum: [draft, open, paid, void, uncollectible]
    PaymentStatus:
      type: string
      enum: [ready, sending, reconciling, succeeded, failed, unknown, cancelled]
    InvoiceSummary:
      type: object
      additionalProperties: false
      required: [id, invoice_number, kind, status, currency, total_micros, issued_at, due_at, paid_at]
      properties:
        id: {type: string, format: uuid}
        invoice_number: {type: [integer, 'null'], minimum: 1}
        kind: {type: string, enum: [subscription, top_up]}
        status: {$ref: '#/components/schemas/InvoiceStatus'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        total_micros: {$ref: '#/components/schemas/MicrosAmount'}
        issued_at: {type: [string, 'null'], format: date-time}
        due_at: {type: [string, 'null'], format: date-time}
        paid_at: {type: [string, 'null'], format: date-time}
    InvoiceDetail:
      type: object
      additionalProperties: false
      required: [id, invoice_number, kind, status, currency, subtotal_micros, tax_micros, total_micros, minor_unit_exponent, issued_at, due_at, paid_at, lines, version]
      properties:
        id: {type: string, format: uuid}
        invoice_number: {type: [integer, 'null'], minimum: 1}
        kind: {type: string, enum: [subscription, top_up]}
        status: {$ref: '#/components/schemas/InvoiceStatus'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        subtotal_micros: {$ref: '#/components/schemas/MicrosAmount'}
        tax_micros: {$ref: '#/components/schemas/MicrosAmount'}
        total_micros: {$ref: '#/components/schemas/MicrosAmount'}
        minor_unit_exponent: {type: [integer, 'null'], minimum: 0, maximum: 4}
        issued_at: {type: [string, 'null'], format: date-time}
        due_at: {type: [string, 'null'], format: date-time}
        paid_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line_no, kind, meter, quantity, unit, unit_price_micros, amount_micros]
            properties:
              line_no: {type: integer, minimum: 1}
              kind: {type: string, enum: [platform_fee, usage, top_up, tax, rounding]}
              meter: {type: [string, 'null']}
              quantity:
                oneOf:
                  - {$ref: '#/components/schemas/MicrosAmount'}
                  - {type: 'null'}
              unit: {type: [string, 'null']}
              unit_price_micros:
                oneOf:
                  - {$ref: '#/components/schemas/MicrosAmount'}
                  - {type: 'null'}
              amount_micros: {$ref: '#/components/schemas/MicrosAmount'}
    CreditSummary:
      type: object
      additionalProperties: false
      required: [balance_microcredits, included_microcredits, overage_policy, recent]
      properties:
        balance_microcredits:
          oneOf:
            - {$ref: '#/components/schemas/MicrosAmount'}
            - {type: 'null'}
        included_microcredits:
          oneOf:
            - {$ref: '#/components/schemas/MicrosAmount'}
            - {type: 'null'}
        overage_policy: {type: [string, 'null'], enum: [pause, explicit_top_up, null]}
        recent:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, amount_microcredits, occurred_at]
            properties:
              kind: {type: string, enum: [allocation, top_up, consumption, expiry, correction]}
              amount_microcredits: {$ref: '#/components/schemas/MicrosAmount'}
              occurred_at: {type: string, format: date-time}
    TopUpOffer:
      type: object
      additionalProperties: false
      required: [offer_id, microcredits, price_micros, currency, quote_hash]
      properties:
        offer_id: {type: string, format: uuid}
        microcredits: {$ref: '#/components/schemas/MicrosAmount'}
        price_micros: {$ref: '#/components/schemas/MicrosAmount'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        quote_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
    RequestTopUp:
      type: object
      additionalProperties: false
      required: [offer_id, quote_hash, request_key]
      properties:
        offer_id: {type: string, format: uuid}
        quote_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        request_key: {type: string, minLength: 16, maxLength: 128}
    RetentionRule:
      type: object
      additionalProperties: false
      required: [id, data_category, classification, retain_days, basis_ref, created_at]
      properties:
        id: {type: string, format: uuid}
        data_category: {type: string}
        classification: {type: string, enum: ['*', public, internal, confidential, restricted]}
        retain_days: {type: [integer, 'null'], minimum: 1}
        basis_ref: {type: string}
        created_at: {type: string, format: date-time}
    SetRetentionRule:
      type: object
      additionalProperties: false
      required: [data_category, classification, retain_days, basis_ref]
      properties:
        data_category:
          type: string
          enum: [transaction_records, work_unit_history, raw_files, search_indexes, derived_embeddings, model_outputs, operational_traces, audit_logs, temporary_debug_captures]
        classification: {type: string, enum: ['*', public, internal, confidential, restricted]}
        retain_days: {type: [integer, 'null'], minimum: 1, maximum: 36500}
        basis_ref: {type: string, minLength: 1, maxLength: 200}
    HoldScope:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {type: string, enum: [organization, client, project, work_unit, artifact]}
        id: {type: [string, 'null'], format: uuid}
    LegalHold:
      type: object
      additionalProperties: false
      required: [id, matter_ref, status, scopes, placed_at, released_at, release_reason_code, version]
      properties:
        id: {type: string, format: uuid}
        matter_ref: {type: string}
        status: {type: string, enum: [active, released]}
        scopes: {type: array, items: {$ref: '#/components/schemas/HoldScope'}}
        placed_at: {type: string, format: date-time}
        released_at: {type: [string, 'null'], format: date-time}
        release_reason_code: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
    PlaceLegalHold:
      type: object
      additionalProperties: false
      required: [matter_ref, scopes]
      properties:
        matter_ref: {type: string, minLength: 1, maxLength: 120}
        scopes: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/HoldScope'}}
    RequestOffboarding:
      type: object
      additionalProperties: false
      required: [confirm_name]
      properties:
        confirm_name: {type: string, minLength: 1, maxLength: 120}
    Offboarding:
      type: object
      additionalProperties: false
      required: [id, state, export_offered_at, export_ref, transition_ends_at, active_holds, unsettled_actions, report, version]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [requested, export_offered, in_transition, winding_down, ready_for_erasure, erasing, verified, reported, cancelled]}
        export_offered_at: {type: [string, 'null'], format: date-time}
        export_ref: {type: [string, 'null']}
        transition_ends_at: {type: [string, 'null'], format: date-time}
        active_holds: {type: integer, minimum: 0}
        unsettled_actions: {type: integer, minimum: 0}
        report: {type: [object, 'null'], description: Counts and codes with no content.}
        version: {type: integer, minimum: 1}
    TicketSummary:
      type: object
      additionalProperties: false
      required: [id, subject, category, status, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        category: {type: string, enum: [account, billing, incident, security, other]}
        status: {type: string, enum: [open, waiting_on_customer, waiting_on_support, resolved, closed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    TicketDetail:
      type: object
      additionalProperties: false
      required: [id, subject, category, status, created_at, updated_at, version, messages]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        category: {type: string, enum: [account, billing, incident, security, other]}
        status: {type: string, enum: [open, waiting_on_customer, waiting_on_support, resolved, closed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
        messages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, author_kind, body, created_at]
            properties:
              id: {type: string, format: uuid}
              author_kind: {type: string, enum: [customer, support]}
              body: {type: string}
              created_at: {type: string, format: date-time}
    OpenTicket:
      type: object
      additionalProperties: false
      required: [subject, category, body]
      properties:
        subject: {type: string, minLength: 1, maxLength: 200}
        category: {type: string, enum: [account, billing, incident, security, other]}
        body: {type: string, minLength: 1, maxLength: 20000}
    ReplyTicket:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 20000}
    BreakGlassRequest:
      type: object
      additionalProperties: false
      required: [id, ticket_id, reason_code, scope_type, scope_id, requested_minutes, state, operator_authorized, customer_authorized, expires_at, version]
      properties:
        id: {type: string, format: uuid}
        ticket_id: {type: string, format: uuid}
        reason_code: {type: string}
        scope_type: {type: string, enum: [work_unit, artifact, client, project]}
        scope_id: {type: string, format: uuid}
        requested_minutes: {type: integer, minimum: 1}
        state: {type: string, enum: [requested, authorized, denied, revoked, expired]}
        operator_authorized: {type: boolean}
        customer_authorized: {type: boolean}
        expires_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    DecideBreakGlass:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [authorize, deny]}
  responses:
    BadRequest:
      description: Malformed path, query, header or body. details.fields names the fields, never their values.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authorization or policy rejection
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Concurrent update, dependency conflict, or an Idempotency-Key reused with a different request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validation:
      description: Input or model/tool compatibility validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Missing or inaccessible resource; avoid existence leaks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: JSON body over the 256 KB limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Body is not application/json
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Something failed on the server. The answer holds no detail about what.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RestorePending:
      description: >-
        This organization's database was restored from a backup and is behind the tombstone ledger,
        so nothing is served until an operator has re-applied the ledger. The code is RESTORE_PENDING,
        the request did nothing, and it can be repeated. Only members of the organization see this.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
