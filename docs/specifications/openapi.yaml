        type:
          type: string
          enum:
            - license
            - maintenance
            - advisory
            - support_policy
        id:
          type: string
          format: uuid
        created:
          type: boolean
        test_key:
          type: boolean
    LicenseStatus:
      type: object
      additionalProperties: false
      required:
        - standing
        - license
        - maintenance
        - running_release
        - seats_in_use
        - notices
      properties:
        standing:
          type: string
          enum:
            - licensed
            - unlicensed
            - unverifiable
        license:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - license_id
                - licensee_name
                - contract_reference
                - term
                - licensed_version
                - footprint_seats
                - issued_at
                - test_key
                - retired_key
              properties:
                license_id:
                  type: string
                  format: uuid
                licensee_name:
                  type: string
                contract_reference:
                  type: string
                term:
                  type: object
                  additionalProperties: false
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - perpetual
                        - pilot
                    review_on:
                      type: string
                      format: date
                licensed_version:
                  type: string
                footprint_seats:
                  type:
                    - integer
                    - "null"
                issued_at:
                  type: string
                  format: date-time
                test_key:
                  type: boolean
                retired_key:
                  type: boolean
        maintenance:
          type: object
          additionalProperties: false
          required:
            - status
            - last_covered_on
          properties:
            status:
              type: string
              enum:
                - no_agreement
                - not_started
                - active
                - lapsed
            last_covered_on:
              type:
                - string
                - "null"
              format: date
        running_release:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - version
                - covered
              properties:
                version:
                  type: string
                covered:
                  type:
                    - boolean
                    - "null"
        seats_in_use:
          type: integer
          minimum: 0
        notices:
          type: array
          items:
            type: string
            enum:
              - no_license
              - license_unverifiable
              - no_maintenance
              - maintenance_lapsed
              - maintenance_not_started
              - pilot_review_due
              - signed_with_test_key
              - signed_with_retired_key
              - clock_before_issue
              - running_release_outside_rights
              - seats_above_footprint
    Advisory:
      type: object
      additionalProperties: false
      required:
        - advisory_id
        - severity
        - title
        - summary
        - affected_versions
        - fixed_in_versions
        - issued_at
        - affects_this_release
        - test_key
      properties:
        advisory_id:
          type: string
        severity:
          type: string
          enum:
            - low
            - moderate
            - high
            - critical
        title:
          type: string
        summary:
          type: string
        affected_versions:
          type: array
          items:
            type: string
        fixed_in_versions:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        affects_this_release:
          type:
            - boolean
            - "null"
        test_key:
          type: boolean
    RequestExport:
      type: object
      additionalProperties: false
      required:
        - recipient_public_key
      properties:
        recipient_public_key:
          type: string
          minLength: 1
          maxLength: 512
    OrganizationExport:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - scope
        - recipient_key_id
        - requested_at
        - finished_at
        - expires_at
        - part_count
        - record_count
        - archive_bytes
        - excluded
        - failure_code
        - downloadable
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - requested
            - running
            - ready
            - failed
            - expired
        scope:
          type: string
          enum:
            - standard
        recipient_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        requested_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        part_count:
          type: integer
          minimum: 0
        record_count:
          type: integer
          minimum: 0
        archive_bytes:
          type: integer
          minimum: 0
        excluded:
          type: object
          additionalProperties: false
          required:
            - restricted_work
            - restricted_artifacts
            - restricted_clients
          properties:
            restricted_work:
              type: integer
              minimum: 0
            restricted_artifacts:
              type: integer
              minimum: 0
            restricted_clients:
              type: integer
              minimum: 0
        failure_code:
          type:
            - string
            - "null"
        downloadable:
          type: boolean
    OrganizationImport:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - requested_at
        - finished_at
        - source_organization_id
        - exported_at
        - source_release
        - applied_counts
        - warning_counts
        - failure_code
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - requested
            - running
            - completed
            - completed_with_warnings
            - failed
        requested_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        source_organization_id:
          type:
            - string
            - "null"
          format: uuid
        exported_at:
          type:
            - string
            - "null"
          format: date-time
        source_release:
          type:
            - string
            - "null"
        applied_counts:
          type: object
          additionalProperties:
            type: integer
        warning_counts:
          type: object
          additionalProperties:
            type: integer
        failure_code:
          type:
            - string
            - "null"
    ImportedPerson:
      type: object
      additionalProperties: false
      required:
        - source_membership_id
        - display_name
        - email
        - source_role
        - target_membership_id
        - linked_at
      properties:
        source_membership_id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
        source_role:
          type: string
          enum:
            - owner
            - admin
            - member
        target_membership_id:
          type:
            - string
            - "null"
          format: uuid
        linked_at:
          type:
            - string
            - "null"
          format: date-time
    LinkImportedPerson:
      type: object
      additionalProperties: false
      required:
        - membership_id
      properties:
        membership_id:
          type: string
          format: uuid
  responses:
    BadRequest:
      description: Malformed path, query, header or body. details.fields names the fields, never their values.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authorization or policy rejection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Concurrent update, dependency conflict, or an Idempotency-Key reused with a different request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Validation:
      description: Input or model/tool compatibility validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Missing or inaccessible resource; avoid existence leaks
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: JSON body over the 256 KB limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Body is not application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Something failed on the server. The answer holds no detail about what.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RestorePending:
      description: This organization's database was restored from a backup and is behind the tombstone
        ledger, so nothing is served until an operator has re-applied the ledger. The code is
        RESTORE_PENDING, the request did nothing, and it can be repeated. Only members of the
        organization see this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
