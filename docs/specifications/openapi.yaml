  /organizations/{organization_id}/knowledge/model-jobs:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      tags: [ knowledge ]
      summary: Request a durable, explicitly approved semantic query
      description: Immediate lexical search remains available separately. This request commits a bounded job; the HTTP process cannot call a model or read its private payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ approval_id, request_key, bounds, classification, query ]
              properties:
                approval_id: { type: string, format: uuid }
                request_key: { type: string, format: uuid }
                bounds: { $ref: '#/components/schemas/KnowledgeModelJobBounds' }
                classification: { type: string, enum: [ public, internal, confidential, restricted ] }
                query: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '202':
          description: Committed durable job. Poll its ID for the current authorized result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeModelJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RestorePending' }
