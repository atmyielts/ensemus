                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeFact"
                  next_cursor:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
    post:
      tags:
        - knowledge
      summary: Propose a fact, on evidence the proposer can read. It is not trusted until reviewed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - subject_ref
                - predicate
                - claim
                - evidence
              properties:
                subject_ref:
                  type: string
                  maxLength: 64
                predicate:
                  type: string
                  pattern: ^[a-z][a-z0-9_.]{0,63}$
                claim: {}
                evidence:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - chunk_id
                      - quote_start
                      - quote_end
                    properties:
                      chunk_id:
                        type: string
                        format: uuid
                      quote_start:
                        type: integer
                        minimum: 0
                      quote_end:
                        type: integer
                        minimum: 1
                valid_from:
                  type: string
                  format: date-time
                valid_until:
                  type: string
                  format: date-time
      responses:
        "201":
