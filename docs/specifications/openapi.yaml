    KnowledgeModelJobBounds:
      type: object
      additionalProperties: false
      description: Explicit caller ceilings within a current workload approval. Input and output ceilings must each fit max_total_tokens. No spend ceiling is supplied by default.
      required: [ max_calls, max_input_tokens, max_output_tokens, max_total_tokens, max_cost_micros, timeout_seconds ]
      properties:
        max_calls: { type: integer, minimum: 1, maximum: 1000 }
        max_input_tokens: { type: integer, minimum: 1, maximum: 2147483647 }
        max_output_tokens: { type: integer, minimum: 1, maximum: 2147483647 }
        max_total_tokens: { type: integer, minimum: 1, maximum: 9007199254740991 }
        max_cost_micros: { type: integer, minimum: 0, maximum: 9007199254740991 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 86400 }
    RequestModelCapabilityQualification:
      type: object
      additionalProperties: false
      required: [expected_profile_version, purpose, dimension, vector_space_version, request_key, bounds]
      properties:
        expected_profile_version: { type: integer, minimum: 1 }
        purpose: { type: string, enum: [embed, rerank, answer] }
        dimension: { type: [integer, 'null'], minimum: 1, maximum: 8192 }
        vector_space_version: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        request_key: { type: string, format: uuid }
        bounds: { $ref: '#/components/schemas/KnowledgeModelJobBounds' }
      description: Exactly one call. Embedding requires explicit dimension and vector-space version; ranking and answers require both fields null. Protocol is derived server-side, not supplied by the requester.
    ApproveModelWorkloadRequest:
      type: object
      additionalProperties: false
      required: [kind, scope, source_id, connection_id, purposes, qualification_ids, max_classification, bounds, expires_at, request_key]
      properties:
        kind: { type: string, enum: [document_embed, query, answer, agent_context] }
        scope: { type: string, enum: [organization, source, connection] }
        source_id: { type: [string, 'null'], format: uuid }
        connection_id: { type: [string, 'null'], format: uuid }
        purposes: { type: array, minItems: 1, maxItems: 3, items: { type: string, enum: [embed, rerank, answer] } }
        qualification_ids: { type: array, minItems: 1, maxItems: 12, items: { type: string, format: uuid } }
        max_classification: { type: string, enum: [public, internal, confidential, restricted] }
        bounds: { $ref: '#/components/schemas/KnowledgeModelJobBounds' }
        expires_at: { type: string, format: date-time }
        request_key: { type: string, format: uuid }
      description: Document indexing requires exactly one source or connection scope. Other workloads use organization scope with both reference fields null. Expiry and every spending ceiling are explicit; no default authority is granted.
    ModelCapabilityEvidence:
      type: object
      additionalProperties: false
      required: [id, profile_id, profile_alias, profile_version, purpose, protocol, dimension, vector_space_version, state, current, usable, result_digest, qualified_at, created_at, bounds, job]
