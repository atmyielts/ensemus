components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The browser session. Writes must also carry an Origin header naming this deployment. API
        tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
      schema: {type: string}
    WorkUnitID:
      name: work_unit_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExternalActionID:
      name: external_action_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    FederationGrantID:
      name: grant_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    FederationItemID:
      name: federation_item_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        project_id: {type: [string, 'null'], format: uuid}
        due_at: {type: [string, 'null'], format: date-time}
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists: {type: boolean}
            reviewer_approved: {type: boolean}
    PendingApproval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, status, tool_name, action, action_hash, expires_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        tool_name: {type: string}
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash: {type: string, description: Quote this when deciding.}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    WorkStatus:
      type: string
      enum: [queued, ready, running, blocked, awaiting_approval, verifying, completed, failed, cancelled]
    WorkUnit:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        objective: {type: string}
        status: {$ref: '#/components/schemas/WorkStatus'}
        version: {type: integer, minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
        completion:
          allOf: [{$ref: '#/components/schemas/WorkCompletion'}]
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required: [basis, confirmed_by_membership_id, confirmed_at]
      properties:
        basis:
          type: string
          enum: [evidence, owner_confirmed, not_recorded]
          description: >-
            `evidence` means the Work Unit's criteria were met. `owner_confirmed` means no evidence
            was requested, and the accountable owner confirmed it themselves. `not_recorded` means
            it finished before this was recorded.
        confirmed_by_membership_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: string, format: date-time}
    EmailContent:
      type: object
      additionalProperties: false
      required: [to, subject, text_body]
      description: Plain text, with no attachments. The sender comes from the connection.
      properties:
        to: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: email}}
        cc: {type: array, maxItems: 50, items: {type: string, format: email}}
        bcc: {type: array, maxItems: 50, items: {type: string, format: email}}
        reply_to: {type: string, format: email}
        subject: {type: string, minLength: 1, maxLength: 200}
        text_body: {type: string, minLength: 1, maxLength: 200000}
    ProposeEmailAction:
      type: object
      additionalProperties: false
      required: [connection_id, approver_membership_id, email]
      properties:
        connection_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ReviseEmailAction:
      type: object
      additionalProperties: false
      required: [approver_membership_id, email]
      properties:
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ProposedExternalAction:
      type: object
      additionalProperties: false
      required: [id, approval_id, request_hash, status]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        request_hash: {type: string, description: What the approval binds. It covers every field sent.}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
    ExternalActionStatus:
      type: string
      enum: [awaiting_approval, ready, sending, reconciling, sent, failed, unknown, cancelled]
      description: >-
        `sent` means the provider accepted it, which for email is the mail server taking it and not
        the message reaching an inbox. `failed` means it was not sent. `unknown` means it could have
        gone and the provider cannot say, so it waits for a person and is never sent again by itself.
    ExternalActionSummary:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, status, status_reason, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null'], description: A code from a fixed list. Never provider text.}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExternalActionReceipt:
      type: object
      additionalProperties: false
      required: [outcome, basis, code, provider_status, external_id, actor_name, recorded_at]
      properties:
        outcome: {type: string, enum: [sent, failed, unknown, cancelled]}
        basis:
          type: string
          enum: [provider, reconciliation, person, system]
          description: Whose word this is. `person` is what someone said they found, not a provider's answer.
        code: {type: [string, 'null']}
        provider_status: {type: [integer, 'null']}
        external_id: {type: [string, 'null'], description: For email, the Message-ID to search for.}
        actor_name: {type: [string, 'null']}
        recorded_at: {type: string, format: date-time}
    ExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
        - connection_name
        - payload
        - request_hash
        - approval_id
        - external_id
        - supersedes_id
        - retry_of_id
        - attempt_count
        - receipts
        - resolution
        - resolution_reason
        - resolved_by_name
        - can_resolve
        - can_retry
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        connection_name: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: Exactly what the approval binds. It cannot be changed once created.
        request_hash: {type: string}
        approval_id: {type: [string, 'null'], format: uuid}
        external_id: {type: [string, 'null']}
        supersedes_id: {type: [string, 'null'], format: uuid}
        retry_of_id: {type: [string, 'null'], format: uuid}
        attempt_count: {type: integer, minimum: 0}
        receipts: {type: array, items: {$ref: '#/components/schemas/ExternalActionReceipt'}}
        resolution: {type: [string, 'null'], enum: [confirmed_sent, confirmed_not_sent, null]}
        resolution_reason: {type: [string, 'null']}
        resolved_by_name: {type: [string, 'null']}
        can_resolve: {type: boolean}
        can_retry: {type: boolean}
    Connection:
      type: object
      additionalProperties: false
      required: [id, connector_type, display_name, state, has_credential, last_error_code, version, created_at]
      properties:
        id: {type: string, format: uuid}
        connector_type: {type: string}
        display_name: {type: string}
        state: {type: string, enum: [active, disabled, revoked]}
        has_credential: {type: boolean}
        last_error_code: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, signing_secret, signature_scheme]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: Shown once. It holds the only copy of the token.}
        signing_secret: {type: string, description: Shown once. Only a sealed copy is kept.}
        signature_scheme: {type: string, enum: [ensemus_hmac_sha256_v1]}
    AgentRun:
      type: object
      required: [id, status, agent_version_id, work_unit_id]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        agent_version_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        estimated_cost_usd: {type: [number, 'null']}
        status_url: {type: string}
    ModelProfile:
      type: object
      required: [id, provider, model_id, allowed_classes]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model_id: {type: string}
        allowed_classes: {type: array, items: {type: string}}
        region: {type: [string, 'null']}
    FederationSettings:
      type: object
      additionalProperties: false
      required: [available, enabled, version, changed_at]
      properties:
        available: {type: boolean, description: Whether this deployment offers it at all.}
        enabled: {type: boolean}
        version: {type: integer, minimum: 0}
        changed_at: {type: [string, 'null'], format: date-time}
    SetFederationSettings:
      type: object
      additionalProperties: false
      required: [enabled, expected_version]
      properties:
        enabled: {type: boolean}
        expected_version: {type: integer, minimum: 0}
    FederationGrantStatus:
      type: string
      enum: [proposed, accepted, active, ended]
    FederationEndReason:
      type: string
      enum: [cancelled, declined, revoked, expired, disabled]
    FederationPurpose:
      type: string
      enum: [delegated_work, document_review]
    FederationItemKind:
      type: string
      enum: [work_summary, artifact, status_update]
    FederationClassification:
      type: string
      enum: [public, internal, confidential]
    FederationItemState:
      type: string
      enum: [queued, delivered, refused, withdrawn]
    FederationDisposition:
      type: string
      enum: [pending, accepted, rejected]
    FederationCrossingOutcome:
      type: string
      enum: [delivered, refused, purged]
    FederationTerms:
      type: object
      additionalProperties: false
      description: The technical scope both owners agree to. It is not a contract and holds no legal wording.
      required: [terms_version, purpose, max_classification, forward_kinds, return_kinds, sharing_organization_id, sharing_display_name, expires_at, note]
      properties:
        terms_version: {type: integer, enum: [1]}
        purpose: {$ref: '#/components/schemas/FederationPurpose'}
        max_classification: {$ref: '#/components/schemas/FederationClassification'}
        forward_kinds: {type: array, items: {$ref: '#/components/schemas/FederationItemKind'}}
        return_kinds: {type: array, items: {$ref: '#/components/schemas/FederationItemKind'}}
        sharing_organization_id: {type: string, format: uuid}
        sharing_display_name: {type: string}
        expires_at: {type: string, format: date-time}
        note: {type: [string, 'null']}
    FederationGrant:
      type: object
      additionalProperties: false
      required: [id, role, status, purpose, max_classification, terms, terms_hash, expires_at, invitation_expires_at, counterparty_name, counterparty_fingerprint, proposed_at, accepted_at, confirmed_at, ended_at, end_reason, ended_by_us, version]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [sharing, receiving]}
        status: {$ref: '#/components/schemas/FederationGrantStatus'}
        purpose: {$ref: '#/components/schemas/FederationPurpose'}
        max_classification: {$ref: '#/components/schemas/FederationClassification'}
        terms: {$ref: '#/components/schemas/FederationTerms'}
        terms_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        expires_at: {type: string, format: date-time}
        invitation_expires_at: {type: string, format: date-time}
        counterparty_name: {type: [string, 'null'], description: The name the other side consented to show. Names are not verified.}
        counterparty_fingerprint: {type: [string, 'null'], description: To compare with the other side by another route.}
        proposed_at: {type: string, format: date-time}
        accepted_at: {type: [string, 'null'], format: date-time}
        confirmed_at: {type: [string, 'null'], format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        end_reason:
          oneOf:
            - {$ref: '#/components/schemas/FederationEndReason'}
            - {type: 'null'}
        ended_by_us: {type: boolean}
        version: {type: integer, minimum: 1}
    ProposeFederationGrant:
      type: object
      additionalProperties: false
      required: [purpose, max_classification, expires_in_days, invitation_expires_in_days]
      properties:
        purpose: {$ref: '#/components/schemas/FederationPurpose'}
        max_classification: {$ref: '#/components/schemas/FederationClassification'}
        expires_in_days: {type: integer, minimum: 1, maximum: 365}
        invitation_expires_in_days: {type: integer, minimum: 1, maximum: 14}
        note: {type: string, minLength: 1, maxLength: 2000}
    CreatedFederationGrant:
      type: object
      additionalProperties: false
      required: [grant, token]
      properties:
        grant: {$ref: '#/components/schemas/FederationGrant'}
        token: {type: string, description: Shown once. Only its hash is kept.}
    RedeemFederationInvitation:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 16, maxLength: 256}
    FederationInvitationPreview:
      type: object
      additionalProperties: false
      required: [terms_hash, terms, sharing_display_name, sharing_fingerprint, invitation_expires_at]
      properties:
        terms_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        terms: {$ref: '#/components/schemas/FederationTerms'}
        sharing_display_name: {type: string}
        sharing_fingerprint: {type: string}
        invitation_expires_at: {type: string, format: date-time}
    AcceptFederationInvitation:
      type: object
      additionalProperties: false
      required: [token, terms_hash]
      properties:
        token: {type: string, minLength: 16, maxLength: 256}
        terms_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
    ConfirmFederationGrant:
      type: object
      additionalProperties: false
      required: [terms_hash, expected_version]
      properties:
        terms_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        expected_version: {type: integer, minimum: 1}
    EndFederationGrant:
      type: object
      additionalProperties: false
      required: [reason, expected_version]
      properties:
        reason: {type: string, enum: [cancelled, declined, revoked]}
        expected_version: {type: integer, minimum: 1}
    PublishFederationItem:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, work_unit_id, title, body]
          properties:
            kind: {type: string, enum: [work_summary]}
            work_unit_id: {type: string, format: uuid}
            title: {type: string, minLength: 1, maxLength: 200}
            body:
              type: object
              additionalProperties: false
              properties:
                objective: {type: string, minLength: 1, maxLength: 20000}
                completion_criteria: {type: string, minLength: 1, maxLength: 20000}
                due_at: {type: string, format: date-time}
        - type: object
          additionalProperties: false
          required: [kind, artifact_id, title]
          properties:
            kind: {type: string, enum: [artifact]}
            artifact_id: {type: string, format: uuid}
            title: {type: string, minLength: 1, maxLength: 200}
        - type: object
          additionalProperties: false
          required: [kind, title, body, classification]
          properties:
            kind: {type: string, enum: [status_update]}
            title: {type: string, minLength: 1, maxLength: 200}
            classification: {$ref: '#/components/schemas/FederationClassification'}
            body:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: {type: string, enum: [received, in_progress, blocked, completed, declined]}
                note: {type: string, minLength: 1, maxLength: 2000}
    FederationOutboundItem:
      type: object
      additionalProperties: false
      required: [id, grant_id, kind, title, body, classification, state, refuse_code, has_file, created_at, delivered_at, withdrawn_at, version]
      properties:
        id: {type: string, format: uuid}
        grant_id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/FederationItemKind'}
        title: {type: string}
        body: {type: object, additionalProperties: true}
        classification: {$ref: '#/components/schemas/FederationClassification'}
        state: {$ref: '#/components/schemas/FederationItemState'}
        refuse_code: {type: [string, 'null']}
        has_file: {type: boolean}
        created_at: {type: string, format: date-time}
        delivered_at: {type: [string, 'null'], format: date-time}
        withdrawn_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    FederationInboundItem:
      type: object
      additionalProperties: false
      required: [id, grant_id, kind, title, body, classification, sender_name, sender_fingerprint, has_file, file_size_bytes, file_mime_type, disposition, linked_work_unit_id, received_at, version]
      properties:
        id: {type: string, format: uuid}
        grant_id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/FederationItemKind'}
        title: {type: string}
        body: {type: object, additionalProperties: true}
        classification: {$ref: '#/components/schemas/FederationClassification'}
        sender_name: {type: string}
        sender_fingerprint: {type: string}
        has_file: {type: boolean}
        file_size_bytes: {type: [integer, 'null'], minimum: 0}
        file_mime_type: {type: [string, 'null']}
        disposition: {$ref: '#/components/schemas/FederationDisposition'}
        linked_work_unit_id: {type: [string, 'null'], format: uuid}
        received_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    DisposeFederationItem:
      type: object
      additionalProperties: false
      required: [disposition, expected_version]
      properties:
        disposition: {type: string, enum: [accepted, rejected]}
        linked_work_unit_id: {type: string, format: uuid}
        expected_version: {type: integer, minimum: 1}
    FederationCrossing:
      type: object
      additionalProperties: false
      required: [id, grant_id, item_id, direction, kind, outcome, code, content_sha256, crossed_at]
      properties:
        id: {type: string, format: uuid}
        grant_id: {type: string, format: uuid}
        item_id: {type: [string, 'null'], format: uuid}
        direction: {type: string, enum: [sent, received]}
        kind:
          oneOf:
            - {$ref: '#/components/schemas/FederationItemKind'}
            - {type: 'null'}
        outcome: {$ref: '#/components/schemas/FederationCrossingOutcome'}
        code: {type: [string, 'null']}
        content_sha256: {type: [string, 'null']}
        crossed_at: {type: string, format: date-time}
    ResidencySurface:
      type: string
      enum: [storage, backups, support, embeddings, inference, telemetry]
    ResidencyScope:
      type: string
      enum: [all, public, internal, confidential, restricted]
    IsolationAspect:
      type: string
      enum: [database, network, worker_pool, temporal_namespace, object_store, backups, embeddings, telemetry, key_encryption_key]
    ResidencyRequirement:
      type: object
      additionalProperties: false
      required: [scope, region, version, updated_at]
      properties:
        scope: {$ref: '#/components/schemas/ResidencyScope'}
        region: {type: string}
        version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    SetResidencyRequirement:
      type: object
      additionalProperties: false
      required: [scope, region, expected_version]
      properties:
        scope: {$ref: '#/components/schemas/ResidencyScope'}
        region: {type: [string, 'null'], pattern: '^[a-z][a-z0-9-]{1,31}$'}
        expected_version: {type: integer, minimum: 0}
    TenancyPosture:
      type: object
      additionalProperties: false
      description: >-
        What an operator declared and what a probe found. It is not a certification, and it promises
        nothing. isolated and all_in_region are true only when every line beneath them says so.
      required: [tier, home_region, cross_org_enabled, isolated, all_in_region, aspects, surfaces]
      properties:
        tier: {type: string, enum: [shared, dedicated]}
        home_region: {type: [string, 'null']}
        cross_org_enabled: {type: boolean}
        isolated: {type: boolean}
        all_in_region: {type: boolean}
        aspects:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [aspect, state, code, checked_at]
            properties:
              aspect: {$ref: '#/components/schemas/IsolationAspect'}
              state: {type: string, enum: [passed, failed, declared, unchecked, stale]}
              code: {type: [string, 'null']}
              checked_at: {type: [string, 'null'], format: date-time}
        surfaces:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [surface, state, regions, evidence_ref, observed_elsewhere]
            properties:
              surface: {$ref: '#/components/schemas/ResidencySurface'}
              state: {type: string, enum: [declared_in_region, declared_elsewhere, undeclared]}
              regions: {type: array, items: {type: string}}
              evidence_ref: {type: [string, 'null']}
              observed_elsewhere: {type: array, items: {type: string}}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
  responses:
    BadRequest:
      description: Malformed path, query, header or body. details.fields names the fields, never their values.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authorization or policy rejection
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Concurrent update, dependency conflict, or an Idempotency-Key reused with a different request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validation:
      description: Input or model/tool compatibility validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Missing or inaccessible resource; avoid existence leaks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: JSON body over the 256 KB limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Body is not application/json
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Something failed on the server. The answer holds no detail about what.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RestorePending:
      description: >-
        This organization's database was restored from a backup and is behind the tombstone ledger,
        so nothing is served until an operator has re-applied the ledger. The code is RESTORE_PENDING,
        the request did nothing, and it can be repeated. Only members of the organization see this.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
