      tags:
        - knowledge
      summary: Facts the caller can read every source of
      parameters:
        - name: subject_ref
          in: query
          schema:
            type: string
            maxLength: 64
        - name: trust_state
          in: query
          schema:
            type: string
            enum:
              - proposed
              - verified
              - disputed
              - superseded
              - rejected
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: One page
