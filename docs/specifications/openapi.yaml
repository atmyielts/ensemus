        - commercial
      summary: One archive's status
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/exports/{export_id}/archive:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/ExportID"
    get:
      tags:
        - commercial
      summary: Download the archive, a tar of sealed parts
      responses:
        "200":
          description: The archive
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
                pattern: ^attachment; filename="[A-Za-z0-9._-]+"$
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: Something was deleted after this archive was made. Make a new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/imports:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    post:
      tags:
        - commercial
      summary: Say this new, empty organization is to take an archive
      description: Owners only. No bytes come through here. An operator runs the import, so that the
        private key opening the archive stays in one process on their machine (ADR-030 D8).
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/imports/{import_id}/files/{source_artifact_id}/download:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ImportID'
      - name: source_artifact_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [ commercial ]
      operationId: downloadImportedArchiveFile
      summary: Download an inert archived file for review by its current native custodian
      description: Requires a finished verified write and current permission checks before and after storage I/O. No Work attachment or provenance promotion is created.
      responses:
        '200':
          description: The verified bytes as an attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RestorePending' }
  /organizations/{organization_id}/imports/{import_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/ImportID"
    get:
      tags:
        - commercial
      summary: How an import went, with counts and warnings
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/imported-people:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      tags:
        - commercial
      summary: People from the archive, and which of them have been linked to a member here
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportedPerson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
  /organizations/{organization_id}/imported-people/{source_membership_id}/link:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: source_membership_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - commercial
      summary: Say this member here is that person from the archive
      description: Owners only. Moves what they owned to them, and grants no role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkImportedPerson"
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPerson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RestorePending"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: The browser session. Writes must also carry an Origin header naming this deployment.
        API tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version last read, as sent in the ETag response header. Weak tags, lists and * are
        refused.
      schema:
        type: string
    WorkUnitID:
      name: work_unit_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalActionID:
      name: external_action_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceID:
      name: source_id
      in: path
      required: true
      description: A source the caller's ACL does not cover answers as if it did not exist.
      schema:
        type: string
        format: uuid
    ExportID:
      name: export_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportID:
      name: import_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required:
        - title
        - objective
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        objective:
          type: string
          minLength: 1
          maxLength: 10000
        project_id:
          type:
            - string
            - "null"
          format: uuid
        due_at:
          type:
            - string
            - "null"
          format: date-time
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists:
              type: boolean
            reviewer_approved:
              type: boolean
            external_receipt:
              type: boolean
              description: The outside system confirms it happened. Accepted only when this organization has an
                active connection that can act, because nothing else could ever satisfy it.
    PendingApproval:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        work_unit_id:
          type: string
          format: uuid
        work_title:
          type: string
        tool_name:
          type: string
        expires_at:
          type: string
          format: date-time
    Approval:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - status
        - tool_name
        - action
        - action_hash
        - expires_at
        - decided_at
      properties:
        id:
          type: string
          format: uuid
        work_unit_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - approved
            - denied
            - expired
            - cancelled
        tool_name:
          type: string
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash:
          type: string
          description: Quote this when deciding.
        expires_at:
          type: string
          format: date-time
        decided_at:
          type:
            - string
            - "null"
          format: date-time
    WorkStatus:
      type: string
      enum:
        - queued
        - ready
        - running
        - blocked
        - awaiting_approval
        - verifying
        - completed
        - failed
        - cancelled
    WorkUnit:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - title
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        title:
          type: string
        objective:
          type: string
        status:
          $ref: "#/components/schemas/WorkStatus"
        version:
          type: integer
          minimum: 1
        due_at:
          type:
            - string
            - "null"
          format: date-time
        completion:
          allOf:
            - $ref: "#/components/schemas/WorkCompletion"
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required:
        - basis
        - confirmed_by_membership_id
        - confirmed_at
      properties:
        basis:
          type: string
          enum:
            - evidence
            - owner_confirmed
            - not_recorded
          description: "`evidence` means the Work Unit's criteria were met. `owner_confirmed` means no
            evidence was requested, and the accountable owner confirmed it themselves.
            `not_recorded` means it finished before this was recorded."
        confirmed_by_membership_id:
          type:
            - string
            - "null"
          format: uuid
        confirmed_at:
          type: string
          format: date-time
    EmailContent:
      type: object
      additionalProperties: false
      required:
        - to
        - subject
        - text_body
      description: Plain text, with no attachments. The sender comes from the connection.
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: email
        cc:
          type: array
          maxItems: 50
          items:
            type: string
            format: email
        bcc:
          type: array
          maxItems: 50
          items:
            type: string
            format: email
        reply_to:
          type: string
          format: email
        subject:
          type: string
          minLength: 1
          maxLength: 200
        text_body:
          type: string
          minLength: 1
          maxLength: 200000
    ProposeEmailAction:
      type: object
      additionalProperties: false
      required:
        - connection_id
        - approver_membership_id
        - email
      properties:
        connection_id:
          type: string
          format: uuid
        approver_membership_id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/EmailContent"
    ReviseEmailAction:
      type: object
      additionalProperties: false
      required:
        - approver_membership_id
        - email
      properties:
        approver_membership_id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/EmailContent"
    ProposedExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - approval_id
        - request_hash
        - status
      properties:
        id:
          type: string
          format: uuid
        approval_id:
          type: string
          format: uuid
        request_hash:
          type: string
          description: What the approval binds. It covers every field sent.
        status:
          $ref: "#/components/schemas/ExternalActionStatus"
    ExternalActionStatus:
      type: string
      enum:
        - awaiting_approval
        - ready
        - sending
        - reconciling
        - sent
        - failed
        - unknown
        - cancelled
      description: "`sent` means the provider accepted it, which for email is the mail server taking it
        and not the message reaching an inbox. `failed` means it was not sent. `unknown` means it
        could have gone and the provider cannot say, so it waits for a person and is never sent
        again by itself."
    ExternalActionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        work_unit_id:
          type: string
          format: uuid
        work_title:
          type: string
        tool_name:
          type: string
        status:
          $ref: "#/components/schemas/ExternalActionStatus"
        status_reason:
          type:
            - string
            - "null"
          description: A code from a fixed list. Never provider text.
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExternalActionReceipt:
      type: object
      additionalProperties: false
      required:
        - outcome
        - basis
        - code
        - provider_status
        - external_id
        - actor_name
        - recorded_at
      properties:
        outcome:
          type: string
          enum:
            - sent
            - failed
            - unknown
            - cancelled
        basis:
          type: string
          enum:
            - provider
            - reconciliation
            - person
            - system
          description: Whose word this is. `person` is what someone said they found, not a provider's answer.
        code:
          type:
            - string
            - "null"
        provider_status:
          type:
            - integer
            - "null"
        external_id:
          type:
            - string
            - "null"
          description: For email
          the Message-ID to search for.: null
        actor_name:
          type:
            - string
            - "null"
        recorded_at:
          type: string
          format: date-time
    ExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
        - connection_name
        - payload
        - request_hash
        - approval_id
        - external_id
        - supersedes_id
        - retry_of_id
        - attempt_count
        - receipts
        - resolution
        - resolution_reason
        - resolved_by_name
        - can_resolve
        - can_retry
      properties:
        id:
          type: string
          format: uuid
        work_unit_id:
          type: string
          format: uuid
        work_title:
          type: string
        tool_name:
          type: string
        status:
          $ref: "#/components/schemas/ExternalActionStatus"
        status_reason:
          type:
            - string
            - "null"
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        connection_name:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: Exactly what the approval binds. It cannot be changed once created.
        request_hash:
          type: string
        approval_id:
          type:
            - string
            - "null"
          format: uuid
        external_id:
          type:
            - string
            - "null"
        supersedes_id:
          type:
            - string
            - "null"
          format: uuid
        retry_of_id:
          type:
            - string
            - "null"
          format: uuid
        attempt_count:
          type: integer
          minimum: 0
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/ExternalActionReceipt"
        resolution:
          type:
            - string
            - "null"
          enum:
            - confirmed_sent
            - confirmed_not_sent
            - null
        resolution_reason:
          type:
            - string
            - "null"
        resolved_by_name:
          type:
            - string
            - "null"
        can_resolve:
          type: boolean
        can_retry:
          type: boolean
    Connection:
      type: object
      additionalProperties: false
      required:
        - id
        - connector_type
        - display_name
        - state
        - has_credential
        - last_error_code
        - version
        - created_at
      properties:
        id:
          type: string
          format: uuid
        connector_type:
          type: string
        display_name:
          type: string
        state:
          type: string
          enum:
            - active
            - disabled
            - revoked
        has_credential:
          type: boolean
        last_error_code:
          type:
            - string
            - "null"
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - signing_secret
        - signature_scheme
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: Shown once. It holds the only copy of the token.
        signing_secret:
          type: string
          description: Shown once. Only a sealed copy is kept.
        signature_scheme:
          type: string
          enum:
            - ensemus_hmac_sha256_v1
    Classification:
      type: string
      enum:
        - public
        - internal
        - confidential
        - restricted
    StartAgentRunRequest:
      type: object
      additionalProperties: false
      required:
        - work_unit_id
        - agent_version_id
      properties:
        work_unit_id:
          type: string
          format: uuid
        agent_version_id:
          type: string
          format: uuid
    RunControlRequest:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - stop
            - pause
            - resume
    AgentRun:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - agent_version_id
        - parent_run_id
        - status
        - stop_code
        - effective_classification
        - model_turns
        - tool_calls
        - input_tokens
        - output_tokens
        - cost_micros
        - cost_is_estimate
        - created_at
        - ended_at
      properties:
        id:
          type: string
          format: uuid
        work_unit_id:
          type: string
          format: uuid
        agent_version_id:
          type: string
          format: uuid
        parent_run_id:
          type:
            - string
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - queued
            - preparing
            - running
            - paused
            - waiting_for_approval
            - waiting_for_child
            - verifying
            - completed
            - failed
            - cancelled
            - budget_exhausted
            - policy_denied
            - timed_out
            - outcome_unverified
        stop_code:
          type:
            - string
            - "null"
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        effective_classification:
          $ref: "#/components/schemas/Classification"
        model_turns:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cost_micros:
          type: integer
          minimum: 0
        cost_is_estimate:
          type: boolean
        created_at:
          type: string
          format: date-time
        ended_at:
          type:
            - string
            - "null"
          format: date-time
    ExecutionStep:
      type: object
      additionalProperties: false
      description: Codes, counters and times. There is no field a model's words could reach.
      required:
        - step_number
        - kind
        - state
        - label_code
        - outcome
        - decision_code
        - started_at
        - ended_at
      properties:
        step_number:
          type: integer
          minimum: 0
        kind:
          type: string
          enum:
            - prepare
            - model_turn
            - tool_call
            - approval_wait
            - delegation
            - verification
        state:
          type: string
          enum:
            - in_flight
            - completed
            - failed
            - cancelled
        label_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        outcome:
          type:
            - string
            - "null"
          pattern: ^[a-z][a-z_]{1,40}$
        decision_code:
          type:
            - string
            - "null"
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
            - string
            - "null"
          format: date-time
    PublishAgentVersionRequest:
      type: object
      additionalProperties: false
      required:
        - spec
        - evaluation_report
      properties:
        spec:
          type: object
          description: An agent spec, per schemas/agent-definition.schema.json
        evaluation_report:
          type: object
          description: A report bound to this spec's SHA-256 and the policy version
    AgentVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - definition_id
        - version_number
        - spec_sha256
        - evaluation_report_sha256
        - policy_version
        - published_by_membership_id
        - published_at
      properties:
        id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        version_number:
          type: integer
          minimum: 1
        spec_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        evaluation_report_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        policy_version:
          type: string
        published_by_membership_id:
          type: string
          format: uuid
        published_at:
          type: string
