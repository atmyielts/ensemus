openapi: 3.1.0
info:
  title: Ensemus Canonical API (Reference Contract)
  version: 2.0.0
  description: >-
    Next.js Route Handler reference interface for tenant-aware work, agent, approval, search and provider
    policies. The work-unit routes, and the approval list, read and decision routes, are implemented, and
    accept a browser session cookie, with writes also checked against the Origin header. Bearer tokens are
    not accepted yet. An operation marked x-ensemus-status planned is an architectural specification and
    does not exist yet. Real responses from every other operation are validated against this file by
    tests/stack/api.test.ts, and tests/unit/openapi-contract.test.ts keeps the two lists honest. The public
    webhook address, POST /api/webhooks/{token}, is not here: it takes no session, it is not a client API,
    and it answers only 202, 404, 413 and 429 with no body, so a stranger learns nothing (ADR-027 D4).
servers:
  - url: https://ensemus.example.invalid/api/v1
    description: Illustrative placeholder; not a live endpoint.
security:
  - sessionCookie: []
tags:
  - name: work
  - name: agents
  - name: approvals
  - name: external-actions
  - name: connections
  - name: knowledge
  - name: models
  - name: commercial
paths:
  /organizations/{organization_id}/work-units:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      tags: [work]
      summary: List permitted Work Units
      parameters:
        - name: cursor
          in: query
          schema: {type: string, minLength: 1, maxLength: 512}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/WorkStatus'}
      responses:
        '200':
          description: Permission-filtered page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/WorkUnit'}}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
    post:
      tags: [work]
      summary: Create a Work Unit
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkUnit'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkUnit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/work-units/{work_unit_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: work_unit_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [work]
      summary: Read permitted Work Unit
      responses:
        '200':
          description: Work Unit
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkUnit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
    patch:
      tags: [work]
      summary: Patch with optimistic version check
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                title: {type: string, minLength: 1, maxLength: 300}
                objective: {type: string, maxLength: 10000}
                due_at: {type: [string, 'null'], format: date-time}
      responses:
        '200':
          description: Updated Work Unit
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkUnit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/work-units/{work_unit_id}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: work_unit_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [work]
      summary: Follow a Work Unit's version as server-sent events
      description: >-
        Sends an event named status whose data and id are both the current version, whenever the version
        differs from the last one sent, and comment heartbeats in between. Status comes from PostgreSQL,
        so a reconnect to any replica resumes from Last-Event-ID. Access is checked again on every poll,
        and the stream ends when access is lost. Connections close after about 15 minutes, and
        EventSource reconnects by itself. With include=evidence it also sends an event named evidence,
        with no id, at once and whenever the Work Unit's files or reviews change, since those can change
        without the version moving. Its data is an opaque value to compare, and says nothing about them.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The last version received. Without a usable value, the current version is sent at once.
          schema: {type: string}
        - name: include
          in: query
          required: false
          description: Asks for evidence events as well as status events.
          schema: {type: string, enum: [evidence]}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/work-units/{work_unit_id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: work_unit_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [work]
      summary: Add prerequisite, rejecting cycles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prerequisite_id]
              additionalProperties: false
              properties:
                prerequisite_id: {type: string, format: uuid}
      responses:
        '201': {description: Added}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/agent-runs:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      x-ensemus-status: planned
      tags: [agents]
      summary: Start bounded agent execution on a Work Unit
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_unit_id, agent_version_id]
              additionalProperties: false
              properties:
                work_unit_id: {type: string, format: uuid}
                agent_version_id: {type: string, format: uuid}
                max_cost_usd: {type: number, minimum: 0}
      responses:
        '202':
          description: Durable run queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
  /organizations/{organization_id}/agent-runs/{agent_run_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: agent_run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      x-ensemus-status: planned
      tags: [agents]
      summary: Read scoped execution progress
      responses:
        '200':
          description: Run record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organization_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      tags: [approvals]
      summary: Approvals waiting on the caller, soonest first
      responses:
        '200':
          description: Pending approvals the caller can decide
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PendingApproval'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/approvals/{approval_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: approval_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [approvals]
      summary: One approval, with the exact action and the hash a decision must quote
      responses:
        '200':
          description: Approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/approvals/{approval_id}/decisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: approval_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [approvals]
      summary: Decide exact immutable proposed action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, action_hash]
              properties:
                decision: {type: string, enum: [approve, deny]}
                action_hash: {type: string, minLength: 32, maxLength: 128}
                reason:
                  type: string
                  maxLength: 2000
                  description: >-
                    Required, and not blank, to deny an approval the work is paused on, because that
                    stops the work for good. Without it the answer is 400 with code REASON_REQUIRED.
      responses:
        '200': {description: Decision recorded}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/work-units/{work_unit_id}/external-actions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/WorkUnitID'
    post:
      x-ensemus-status: planned
      tags: [external-actions]
      summary: Propose an email, for a named person to approve exactly as written
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProposeEmailAction'}
      responses:
        '201':
          description: Proposed. Nothing has been sent, and nothing is sent without that approval.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProposedExternalAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/external-actions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [external-actions]
      summary: External actions on work the caller can read
      parameters:
        - name: cursor
          in: query
          schema: {type: string, minLength: 1, maxLength: 512}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ExternalActionStatus'}
        - name: work_unit_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Permission-filtered page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ExternalActionSummary'}}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/external-actions/{external_action_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ExternalActionID'
    get:
      x-ensemus-status: planned
      tags: [external-actions]
      summary: One external action, with its exact payload and every receipt
      responses:
        '200':
          description: The action. `unknown` means nobody can say whether it was sent.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/external-actions/{external_action_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ExternalActionID'
    post:
      x-ensemus-status: planned
      tags: [external-actions]
      summary: Change what would be sent. This closes the action and its approval, and asks for a new one
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviseEmailAction'}
      responses:
        '201':
          description: A new action, waiting for its own approval. The old one can no longer be sent.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProposedExternalAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/external-actions/{external_action_id}/resolution:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ExternalActionID'
    post:
      x-ensemus-status: planned
      tags: [external-actions]
      summary: Say what happened to an action in the unknown state. It never sends anything
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolution, reason]
              properties:
                resolution: {type: string, enum: [confirmed_sent, confirmed_not_sent]}
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Recorded, as this person's word
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/external-actions/{external_action_id}/retries:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ExternalActionID'
    post:
      x-ensemus-status: planned
      tags: [external-actions]
      summary: Ask again for an action that ended failed, as a new action with a new approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approver_membership_id]
              properties:
                approver_membership_id: {type: string, format: uuid}
      responses:
        '201':
          description: A new action, waiting for its own approval
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProposedExternalAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/connections:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [connections]
      summary: Connections in this organization, without their credentials
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Connection'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
    post:
      x-ensemus-status: planned
      tags: [connections]
      summary: Add a connection. A credential is sealed on arrival and can never be read back
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connector_type, display_name, config]
              properties:
                connector_type: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
                display_name: {type: string, minLength: 1, maxLength: 120}
                config:
                  type: object
                  additionalProperties: true
                  description: Checked against that connector's settings. It can never name a host.
                credential: {type: string, minLength: 1, maxLength: 4096}
      responses:
        '201':
          description: Connection, without its credential
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/connections/{connection_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ConnectionID'
    get:
      x-ensemus-status: planned
      tags: [connections]
      summary: One connection, without its credential
      responses:
        '200':
          description: Connection
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
    delete:
      x-ensemus-status: planned
      tags: [connections]
      summary: Revoke a connection. Nothing not yet attempted goes out through it after this
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': {description: Revoked}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/connections/{connection_id}/sync:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ConnectionID'
    post:
      x-ensemus-status: planned
      tags: [connections]
      summary: Ask a connection to read its source now
      responses:
        '202': {description: Asked. The connection's state shows how it went.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/connections/{connection_id}/webhook-endpoints:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ConnectionID'
    post:
      x-ensemus-status: planned
      tags: [connections]
      summary: Make a callback address. Its URL and signing secret are shown here once, and never again
      responses:
        '201':
          description: The address and its secret. Only hashes and sealed values are kept.
          headers:
            Cache-Control:
              description: This response holds secrets, so nothing may keep it.
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedWebhookEndpoint'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/knowledge/search:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      x-ensemus-status: planned
      tags: [knowledge]
      summary: Search authorized knowledge with citations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 4000}
                limit: {type: integer, minimum: 1, maximum: 50, default: 10}
                allowed_source_ids:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: Permission-filtered results
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [source_id, excerpt, source_version]
                      properties:
                        source_id: {type: string, format: uuid}
                        source_version: {type: string}
                        excerpt: {type: string}
                        citation_ref: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organizations/{organization_id}/model-profiles:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [models]
      summary: List authorized provider profiles without secrets
      responses:
        '200':
          description: Approved model profile metadata only
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles: {type: array, items: {$ref: '#/components/schemas/ModelProfile'}}
  /organizations/{organization_id}/entitlements:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Read current commercial mode, features, and quotas
      responses:
        '200':
          description: Entitlements (no license private keys)
          content:
            application/json:
              schema:
                type: object
                required: [mode, features]
                properties:
                  mode: {type: string, enum: [cloud, byom, sovereign]}
                  features: {type: array, items: {type: string}}
                  capacity: {type: object, additionalProperties: true}
  /organizations/{organization_id}/license:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: What this organization's license and maintenance say
      description: >-
        Read by owners and admins. Every value comes from a signed document verified as it is read. What this
        answers is shown to people and is never used to refuse a request (ADR-030 D2).
      responses:
        '200':
          description: License status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organization_id}/license/documents:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Install a signed license, maintenance statement, advisory or support policy
      description: >-
        Owners only. A file that does not verify changes nothing. Installing the same file twice is safe, and
        answers 200 the second time.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallSignedDocument'}
      responses:
        '200':
          description: This exact file was already installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstalledDocument'}
        '201':
          description: Installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstalledDocument'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organization_id}/advisories:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Signed security advisories installed here, newest first
      responses:
        '200':
          description: Advisories
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Advisory'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organization_id}/exports:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Archives of this organization, newest first
      responses:
        '200':
          description: Exports
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/OrganizationExport'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Ask for an archive, sealed to a public key you hold the private half of
      description: >-
        Owners only. Restricted work is left out, and the archive says how much (ADR-030 D10). Runs in the
        worker, and this answers before it starts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestExport'}
      responses:
        '202':
          description: Requested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationExport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /organizations/{organization_id}/exports/{export_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ExportID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: One archive's status
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationExport'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organization_id}/exports/{export_id}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ExportID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Download the archive, a tar of sealed parts
      responses:
        '200':
          description: The archive
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410':
          description: Something was deleted after this archive was made. Make a new one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /organizations/{organization_id}/imports:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Say this new, empty organization is to take an archive
      description: >-
        Owners only. No bytes come through here. An operator runs the import, so that the private key opening
        the archive stays in one process on their machine (ADR-030 D8).
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationImport'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /organizations/{organization_id}/imports/{import_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ImportID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: How an import went, with counts and warnings
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationImport'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organization_id}/imported-people:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [commercial]
      summary: People from the archive, and which of them have been linked to a member here
      responses:
        '200':
          description: People
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ImportedPerson'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organization_id}/imported-people/{source_membership_id}/link:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: source_membership_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      x-ensemus-status: planned
      tags: [commercial]
      summary: Say this member here is that person from the archive
      description: Owners only. Moves what they owned to them, and grants no role.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkImportedPerson'}
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportedPerson'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The browser session. Writes must also carry an Origin header naming this deployment. API
        tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
      schema: {type: string}
    WorkUnitID:
      name: work_unit_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExternalActionID:
      name: external_action_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExportID:
      name: export_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ImportID:
      name: import_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        project_id: {type: [string, 'null'], format: uuid}
        due_at: {type: [string, 'null'], format: date-time}
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists: {type: boolean}
            reviewer_approved: {type: boolean}
    PendingApproval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, status, tool_name, action, action_hash, expires_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        tool_name: {type: string}
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash: {type: string, description: Quote this when deciding.}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    WorkStatus:
      type: string
      enum: [queued, ready, running, blocked, awaiting_approval, verifying, completed, failed, cancelled]
    WorkUnit:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        objective: {type: string}
        status: {$ref: '#/components/schemas/WorkStatus'}
        version: {type: integer, minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
        completion:
          allOf: [{$ref: '#/components/schemas/WorkCompletion'}]
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required: [basis, confirmed_by_membership_id, confirmed_at]
      properties:
        basis:
          type: string
          enum: [evidence, owner_confirmed, not_recorded]
          description: >-
            `evidence` means the Work Unit's criteria were met. `owner_confirmed` means no evidence
            was requested, and the accountable owner confirmed it themselves. `not_recorded` means
            it finished before this was recorded.
        confirmed_by_membership_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: string, format: date-time}
    EmailContent:
      type: object
      additionalProperties: false
      required: [to, subject, text_body]
      description: Plain text, with no attachments. The sender comes from the connection.
      properties:
        to: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: email}}
        cc: {type: array, maxItems: 50, items: {type: string, format: email}}
        bcc: {type: array, maxItems: 50, items: {type: string, format: email}}
        reply_to: {type: string, format: email}
        subject: {type: string, minLength: 1, maxLength: 200}
        text_body: {type: string, minLength: 1, maxLength: 200000}
    ProposeEmailAction:
      type: object
      additionalProperties: false
      required: [connection_id, approver_membership_id, email]
      properties:
        connection_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ReviseEmailAction:
      type: object
      additionalProperties: false
      required: [approver_membership_id, email]
      properties:
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ProposedExternalAction:
      type: object
      additionalProperties: false
      required: [id, approval_id, request_hash, status]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        request_hash: {type: string, description: What the approval binds. It covers every field sent.}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
    ExternalActionStatus:
      type: string
      enum: [awaiting_approval, ready, sending, reconciling, sent, failed, unknown, cancelled]
      description: >-
        `sent` means the provider accepted it, which for email is the mail server taking it and not
        the message reaching an inbox. `failed` means it was not sent. `unknown` means it could have
        gone and the provider cannot say, so it waits for a person and is never sent again by itself.
    ExternalActionSummary:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, status, status_reason, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null'], description: A code from a fixed list. Never provider text.}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExternalActionReceipt:
      type: object
      additionalProperties: false
      required: [outcome, basis, code, provider_status, external_id, actor_name, recorded_at]
      properties:
        outcome: {type: string, enum: [sent, failed, unknown, cancelled]}
        basis:
          type: string
          enum: [provider, reconciliation, person, system]
          description: Whose word this is. `person` is what someone said they found, not a provider's answer.
        code: {type: [string, 'null']}
        provider_status: {type: [integer, 'null']}
        external_id: {type: [string, 'null'], description: For email, the Message-ID to search for.}
        actor_name: {type: [string, 'null']}
        recorded_at: {type: string, format: date-time}
    ExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
        - connection_name
        - payload
        - request_hash
        - approval_id
        - external_id
        - supersedes_id
        - retry_of_id
        - attempt_count
        - receipts
        - resolution
        - resolution_reason
        - resolved_by_name
        - can_resolve
        - can_retry
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        connection_name: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: Exactly what the approval binds. It cannot be changed once created.
        request_hash: {type: string}
        approval_id: {type: [string, 'null'], format: uuid}
        external_id: {type: [string, 'null']}
        supersedes_id: {type: [string, 'null'], format: uuid}
        retry_of_id: {type: [string, 'null'], format: uuid}
        attempt_count: {type: integer, minimum: 0}
        receipts: {type: array, items: {$ref: '#/components/schemas/ExternalActionReceipt'}}
        resolution: {type: [string, 'null'], enum: [confirmed_sent, confirmed_not_sent, null]}
        resolution_reason: {type: [string, 'null']}
        resolved_by_name: {type: [string, 'null']}
        can_resolve: {type: boolean}
        can_retry: {type: boolean}
    Connection:
      type: object
      additionalProperties: false
      required: [id, connector_type, display_name, state, has_credential, last_error_code, version, created_at]
      properties:
        id: {type: string, format: uuid}
        connector_type: {type: string}
        display_name: {type: string}
        state: {type: string, enum: [active, disabled, revoked]}
        has_credential: {type: boolean}
        last_error_code: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, signing_secret, signature_scheme]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: Shown once. It holds the only copy of the token.}
        signing_secret: {type: string, description: Shown once. Only a sealed copy is kept.}
        signature_scheme: {type: string, enum: [ensemus_hmac_sha256_v1]}
    AgentRun:
      type: object
      required: [id, status, agent_version_id, work_unit_id]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        agent_version_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        estimated_cost_usd: {type: [number, 'null']}
        status_url: {type: string}
    ModelProfile:
      type: object
      required: [id, provider, model_id, allowed_classes]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model_id: {type: string}
        allowed_classes: {type: array, items: {type: string}}
        region: {type: [string, 'null']}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
    InstallSignedDocument:
      type: object
      additionalProperties: false
      required: [envelope]
      properties:
        envelope: {type: string, minLength: 1, maxLength: 1048576}
    InstalledDocument:
      type: object
      additionalProperties: false
      required: [type, id, created, test_key]
      properties:
        type: {type: string, enum: [license, maintenance, advisory, support_policy]}
        id: {type: string, format: uuid}
        created: {type: boolean}
        test_key: {type: boolean}
    LicenseStatus:
      type: object
      additionalProperties: false
      required: [standing, license, maintenance, running_release, seats_in_use, notices]
      properties:
        standing: {type: string, enum: [licensed, unlicensed, unverifiable]}
        license:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [license_id, licensee_name, contract_reference, term, licensed_version, footprint_seats, issued_at, test_key, retired_key]
              properties:
                license_id: {type: string, format: uuid}
                licensee_name: {type: string}
                contract_reference: {type: string}
                term:
                  type: object
                  additionalProperties: false
                  required: [kind]
                  properties:
                    kind: {type: string, enum: [perpetual, pilot]}
                    review_on: {type: string, format: date}
                licensed_version: {type: string}
                footprint_seats: {type: [integer, 'null']}
                issued_at: {type: string, format: date-time}
                test_key: {type: boolean}
                retired_key: {type: boolean}
        maintenance:
          type: object
          additionalProperties: false
          required: [status, last_covered_on]
          properties:
            status: {type: string, enum: [no_agreement, not_started, active, lapsed]}
            last_covered_on: {type: [string, 'null'], format: date}
        running_release:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [version, covered]
