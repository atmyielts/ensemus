        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/marketplace/submissions/{submission_id}/withdrawal:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SubmissionID'
    post:
      x-ensemus-status: planned
      tags: [marketplace]
      summary: Withdraw a submission that is not listed
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200':
          description: Submission
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketplaceSubmission'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/marketplace/submissions/{submission_id}/delist-request:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SubmissionID'
    post:
      x-ensemus-status: planned
      tags: [marketplace]
      summary: Ask the operator to take a listing down. A publisher cannot write a listing itself
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200':
          description: Submission
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketplaceSubmission'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/marketplace/listings:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [marketplace]
      summary: What is on offer on this deployment. Each has been signed and reviewed
      parameters:
        - name: cursor
          in: query
          schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: Page of listings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/MarketplaceListing'}}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/marketplace/listings/{listing_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ListingID'
    get:
      x-ensemus-status: planned
      tags: [marketplace]
      summary: One listing, with what it would be able to ask for and who reviewed it
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketplaceListing'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/marketplace/installations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      x-ensemus-status: planned
      tags: [marketplace]
      summary: What this organization has taken from the marketplace
      responses:
        '200':
          description: Installations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/MarketplaceInstallation'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
    post:
      x-ensemus-status: planned
      tags: [marketplace]
      summary: Take a listing. This copies it and grants nothing, and someone still has to publish it here
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [listing_id]
              properties:
                listing_id: {type: string, format: uuid}
      responses:
        '202':
          description: Queued
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketplaceInstallation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
  /organizations/{organization_id}/marketplace/installations/{installation_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/InstallationID'
    delete:
      x-ensemus-status: planned
      tags: [marketplace]
      summary: Remove an installed package, and stop its versions being used here
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '204': {description: Removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/RestorePending'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The browser session. Writes must also carry an Origin header naming this deployment. API
        tokens are not available yet.
  headers:
    ETag:
      description: The version just read or written, as an entity tag. Send it back in If-Match.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Requires authenticated organization membership; UUID alone is never authorization.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version last read, as sent in the ETag response header. Weak tags, lists and * are refused.
      schema: {type: string}
    WorkUnitID:
      name: work_unit_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExternalActionID:
      name: external_action_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SkillSignerID:
      name: skill_signer_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SkillPackageID:
      name: skill_package_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SkillVersionID:
      name: skill_version_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SandboxRunID:
      name: sandbox_run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubmissionID:
      name: submission_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ListingID:
      name: listing_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    InstallationID:
      name: installation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CreateWorkUnit:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        project_id: {type: [string, 'null'], format: uuid}
        due_at: {type: [string, 'null'], format: date-time}
        completion_criteria:
          type: object
          additionalProperties: false
          description: Which evidence this work needs before it can be completed.
          properties:
            artifact_exists: {type: boolean}
            reviewer_approved: {type: boolean}
    PendingApproval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, status, tool_name, action, action_hash, expires_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        tool_name: {type: string}
        action:
          type: object
          additionalProperties: true
          description: The exact action this approval binds. It cannot be changed once created.
        action_hash: {type: string, description: Quote this when deciding.}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    WorkStatus:
      type: string
      enum: [queued, ready, running, blocked, awaiting_approval, verifying, completed, failed, cancelled]
    WorkUnit:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        objective: {type: string}
        status: {$ref: '#/components/schemas/WorkStatus'}
        version: {type: integer, minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
        completion:
          allOf: [{$ref: '#/components/schemas/WorkCompletion'}]
          description: On reading one finished Work Unit, what its completion rests on.
    WorkCompletion:
      type: object
      additionalProperties: false
      required: [basis, confirmed_by_membership_id, confirmed_at]
      properties:
        basis:
          type: string
          enum: [evidence, owner_confirmed, not_recorded]
          description: >-
            `evidence` means the Work Unit's criteria were met. `owner_confirmed` means no evidence
            was requested, and the accountable owner confirmed it themselves. `not_recorded` means
            it finished before this was recorded.
        confirmed_by_membership_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: string, format: date-time}
    EmailContent:
      type: object
      additionalProperties: false
      required: [to, subject, text_body]
      description: Plain text, with no attachments. The sender comes from the connection.
      properties:
        to: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: email}}
        cc: {type: array, maxItems: 50, items: {type: string, format: email}}
        bcc: {type: array, maxItems: 50, items: {type: string, format: email}}
        reply_to: {type: string, format: email}
        subject: {type: string, minLength: 1, maxLength: 200}
        text_body: {type: string, minLength: 1, maxLength: 200000}
    ProposeEmailAction:
      type: object
      additionalProperties: false
      required: [connection_id, approver_membership_id, email]
      properties:
        connection_id: {type: string, format: uuid}
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ReviseEmailAction:
      type: object
      additionalProperties: false
      required: [approver_membership_id, email]
      properties:
        approver_membership_id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/EmailContent'}
    ProposedExternalAction:
      type: object
      additionalProperties: false
      required: [id, approval_id, request_hash, status]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        request_hash: {type: string, description: What the approval binds. It covers every field sent.}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
    ExternalActionStatus:
      type: string
      enum: [awaiting_approval, ready, sending, reconciling, sent, failed, unknown, cancelled]
      description: >-
        `sent` means the provider accepted it, which for email is the mail server taking it and not
        the message reaching an inbox. `failed` means it was not sent. `unknown` means it could have
        gone and the provider cannot say, so it waits for a person and is never sent again by itself.
    ExternalActionSummary:
      type: object
      additionalProperties: false
      required: [id, work_unit_id, work_title, tool_name, status, status_reason, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null'], description: A code from a fixed list. Never provider text.}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExternalActionReceipt:
      type: object
      additionalProperties: false
      required: [outcome, basis, code, provider_status, external_id, actor_name, recorded_at]
      properties:
        outcome: {type: string, enum: [sent, failed, unknown, cancelled]}
        basis:
          type: string
          enum: [provider, reconciliation, person, system]
          description: Whose word this is. `person` is what someone said they found, not a provider's answer.
        code: {type: [string, 'null']}
        provider_status: {type: [integer, 'null']}
        external_id: {type: [string, 'null'], description: For email, the Message-ID to search for.}
        actor_name: {type: [string, 'null']}
        recorded_at: {type: string, format: date-time}
    ExternalAction:
      type: object
      additionalProperties: false
      required:
        - id
        - work_unit_id
        - work_title
        - tool_name
        - status
        - status_reason
        - version
        - created_at
        - updated_at
        - connection_name
        - payload
        - request_hash
        - approval_id
        - external_id
        - supersedes_id
        - retry_of_id
        - attempt_count
        - receipts
        - resolution
        - resolution_reason
        - resolved_by_name
        - can_resolve
        - can_retry
      properties:
        id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        work_title: {type: string}
        tool_name: {type: string}
        status: {$ref: '#/components/schemas/ExternalActionStatus'}
        status_reason: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        connection_name: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: Exactly what the approval binds. It cannot be changed once created.
        request_hash: {type: string}
        approval_id: {type: [string, 'null'], format: uuid}
        external_id: {type: [string, 'null']}
        supersedes_id: {type: [string, 'null'], format: uuid}
        retry_of_id: {type: [string, 'null'], format: uuid}
        attempt_count: {type: integer, minimum: 0}
        receipts: {type: array, items: {$ref: '#/components/schemas/ExternalActionReceipt'}}
        resolution: {type: [string, 'null'], enum: [confirmed_sent, confirmed_not_sent, null]}
        resolution_reason: {type: [string, 'null']}
        resolved_by_name: {type: [string, 'null']}
        can_resolve: {type: boolean}
        can_retry: {type: boolean}
    Connection:
      type: object
      additionalProperties: false
      required: [id, connector_type, display_name, state, has_credential, last_error_code, version, created_at]
      properties:
        id: {type: string, format: uuid}
        connector_type: {type: string}
        display_name: {type: string}
        state: {type: string, enum: [active, disabled, revoked]}
        has_credential: {type: boolean}
        last_error_code: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, signing_secret, signature_scheme]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: Shown once. It holds the only copy of the token.}
        signing_secret: {type: string, description: Shown once. Only a sealed copy is kept.}
        signature_scheme: {type: string, enum: [ensemus_hmac_sha256_v1]}
    AgentRun:
      type: object
      required: [id, status, agent_version_id, work_unit_id]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        agent_version_id: {type: string, format: uuid}
        work_unit_id: {type: string, format: uuid}
        estimated_cost_usd: {type: [number, 'null']}
        status_url: {type: string}
    ModelProfile:
      type: object
      required: [id, provider, model_id, allowed_classes]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model_id: {type: string}
        allowed_classes: {type: array, items: {type: string}}
        region: {type: [string, 'null']}
    SkillContentClassification:
      type: string
      enum: [public, internal, confidential, restricted]
      description: How sensitive a package's own instructions are. Only public can be submitted for listing.
    SkillSigner:
      type: object
      additionalProperties: false
      required: [id, display_name, key_id, state, version, created_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        key_id: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the raw public key.}
        state: {type: string, enum: [active, revoked]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    SkillPackage:
      type: object
      additionalProperties: false
      required: [id, name, display_name, origin, state, content_classification, listing_id, version, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        display_name: {type: string}
        origin: {type: string, enum: [tenant, marketplace]}
        state: {type: string, enum: [active, disabled]}
        content_classification: {$ref: '#/components/schemas/SkillContentClassification'}
        listing_id: {type: [string, 'null'], format: uuid}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    SkillVersionState:
      type: string
      enum: [uploaded, verifying, verified, rejected, published, yanked]
    SkillTestResult:
      type: object
      additionalProperties: false
      required: [mode, outcome, fixtures_total, fixtures_passed, first_failed_fixture, code, finished_at]
      properties:
        mode: {type: string, enum: [contract, sandbox]}
        outcome: {type: string, enum: [passed, failed, error]}
        fixtures_total: {type: integer, minimum: 1}
        fixtures_passed: {type: integer, minimum: 0}
        first_failed_fixture: {type: [integer, 'null'], minimum: 0}
        code: {type: [string, 'null']}
        finished_at: {type: string, format: date-time}
    SkillVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - package_id
        - state
        - bundle_sha256
        - size_bytes
        - semver
        - digest
        - execution_kind
        - license
        - max_classification
        - signer_key_id
        - tool_boundaries
        - reject_code
        - yank_code
        - latest_test
        - uploaded_at
        - published_at
        - version
      description: >-
        Everything but the bytes' hash and size is null until a worker has checked the bundle. What it
        declares is shown so a person can see what it could ask for before it goes live, and declaring a
        tool grants nothing.
      properties:
        id: {type: string, format: uuid}
        package_id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/SkillVersionState'}
        bundle_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        size_bytes: {type: integer, minimum: 1}
        semver: {type: [string, 'null']}
        digest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        execution_kind: {type: [string, 'null'], enum: [declarative, sandbox, null]}
        license: {type: [string, 'null']}
        max_classification: {type: [string, 'null'], enum: [public, internal, confidential, null]}
        signer_key_id: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        tool_boundaries: {type: array, items: {type: string}}
        reject_code: {type: [string, 'null']}
        yank_code: {type: [string, 'null']}
        latest_test:
          oneOf:
            - {$ref: '#/components/schemas/SkillTestResult'}
            - {type: 'null'}
        uploaded_at: {type: string, format: date-time}
        published_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    SandboxRunStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - timed_out
        - memory_exceeded
        - output_exceeded
        - denied
        - cancelled
        - runner_unavailable
    IsolationEvidence:
      type: string
      enum: [none, probe_passed]
      description: >-
        How much anyone can say. probe_passed means a runner's own probe found the limits held for one job
        on this server. There is no value meaning isolated, because only outside review could say that.
    SandboxLimits:
      type: object
      additionalProperties: false
      required: [wall_ms, cpu_ms, memory_mb, tmpfs_mb, output_kb, pids]
      properties:
        wall_ms: {type: integer, minimum: 1}
        cpu_ms: {type: integer, minimum: 1}
        memory_mb: {type: integer, minimum: 1}
        tmpfs_mb: {type: integer, minimum: 1}
        output_kb: {type: integer, minimum: 1}
        pids: {type: integer, minimum: 1}
    SandboxRun:
      type: object
      additionalProperties: false
      required:
        - id
        - skill_version_id
        - purpose
        - classification
        - status
        - outcome_code
        - limits
        - network
        - isolation_evidence
        - exit_code
        - wall_ms
        - cpu_ms
        - peak_memory_kb
        - output
        - created_at
        - finished_at
        - version
      properties:
        id: {type: string, format: uuid}
        skill_version_id: {type: string, format: uuid}
        purpose: {type: string, enum: [skill_test, agent_tool, operator_test]}
        classification: {type: string, enum: [public, internal, confidential]}
        status: {$ref: '#/components/schemas/SandboxRunStatus'}
        outcome_code: {type: [string, 'null']}
        limits: {$ref: '#/components/schemas/SandboxLimits'}
        network: {type: string, enum: [none]}
        isolation_evidence: {$ref: '#/components/schemas/IsolationEvidence'}
        exit_code: {type: [integer, 'null']}
        wall_ms: {type: [integer, 'null']}
        cpu_ms: {type: [integer, 'null']}
        peak_memory_kb: {type: [integer, 'null']}
        output: {description: What the code returned. Data, never instructions.}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    SandboxStatus:
      type: object
      additionalProperties: false
      required: [enabled, isolation_evidence, last_probe_passed_at, ceilings]
      description: >-
        What this organization has seen, from its own runs. The web tier has no path to a runner, so a
        deployment nobody has run anything on has no evidence to show.
      properties:
        enabled: {type: boolean}
        isolation_evidence: {$ref: '#/components/schemas/IsolationEvidence'}
        last_probe_passed_at: {type: [string, 'null'], format: date-time}
        ceilings: {$ref: '#/components/schemas/SandboxLimits'}
    MarketplacePublisher:
      type: object
      additionalProperties: false
      required: [id, display_name, state, version]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        state: {type: string, enum: [active, suspended]}
        version: {type: integer, minimum: 1}
    MarketplaceSubmission:
      type: object
      additionalProperties: false
      required: [id, skill_version_id, name, semver, digest, state, delist_requested_at, finding_codes, created_at, decided_at, version]
      properties:
        id: {type: string, format: uuid}
        skill_version_id: {type: string, format: uuid}
        name: {type: string}
        semver: {type: string}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        state: {type: string, enum: [submitted, in_review, approved, rejected, withdrawn]}
        delist_requested_at: {type: [string, 'null'], format: date-time}
        finding_codes: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    MarketplaceListing:
      type: object
      additionalProperties: false
      required:
        - id
        - publisher_display_name
        - name
        - semver
        - display_name
        - summary
        - digest
        - license
        - execution_kind
        - max_classification
        - tool_boundaries
        - signer_key_id
        - reviewer_key_id
        - state
        - delist_mode
        - listed_at
      description: >-
        Reviewed means someone holding a review key looked and signed, on the date shown. It is not a
        certification. There is no price here, because nothing in M11B takes a payment.
      properties:
        id: {type: string, format: uuid}
        publisher_display_name: {type: string}
        name: {type: string}
        semver: {type: string}
        display_name: {type: string}
        summary: {type: string}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        license: {type: string}
        execution_kind: {type: string, enum: [declarative, sandbox]}
        max_classification: {type: string, enum: [public, internal, confidential]}
        tool_boundaries: {type: array, items: {type: string}}
        signer_key_id: {type: string, pattern: '^[0-9a-f]{64}$'}
        reviewer_key_id: {type: string, pattern: '^[0-9a-f]{64}$'}
        state: {type: string, enum: [listed, delisted]}
        delist_mode: {type: [string, 'null'], enum: [stop_new, revoke, null]}
        listed_at: {type: string, format: date-time}
    MarketplaceInstallation:
      type: object
      additionalProperties: false
      required: [id, listing_id, state, package_id, skill_version_id, failure_code, created_at, version]
      properties:
        id: {type: string, format: uuid}
        listing_id: {type: string, format: uuid}
        state: {type: string, enum: [requested, installing, installed, failed, removed]}
        package_id: {type: [string, 'null'], format: uuid}
        skill_version_id: {type: [string, 'null'], format: uuid}
        failure_code: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
  responses:
    BadRequest:
      description: Malformed path, query, header or body. details.fields names the fields, never their values.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authorization or policy rejection
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Concurrent update, dependency conflict, or an Idempotency-Key reused with a different request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validation:
      description: Input or model/tool compatibility validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Missing or inaccessible resource; avoid existence leaks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: JSON body over the 256 KB limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SkillBundleTooLarge:
      description: Skill bundle over the 8 MiB limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Body is not application/json
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Something failed on the server. The answer holds no detail about what.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RestorePending:
      description: >-
        This organization's database was restored from a backup and is behind the tombstone ledger,
        so nothing is served until an operator has re-applied the ledger. The code is RESTORE_PENDING,
        the request did nothing, and it can be repeated. Only members of the organization see this.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
