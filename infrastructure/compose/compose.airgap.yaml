# Air-gap gate overlay (PLAT-16). DNS points at an unreachable test address (TEST-NET-3), so any lookup
# of an outside name becomes an outbound packet that the gate counts as an attempt. It changes nothing
# else: the addresses and name pins under test are the ones compose.yaml ships.
x-airgap-dns: &dns
  dns: ['203.0.113.53']

services:
  proxy: *dns
  web: *dns
  web-2: *dns
  worker: *dns
  knowledge-worker: *dns
  agent-worker: *dns
  dispatcher: *dns
  connector-worker: *dns
  egress-gateway: *dns
  egress-google-api: *dns
  egress-google-oauth: *dns
  egress-ms-graph: *dns
  egress-ms-login: *dns
  egress-google-gmail: *dns
  egress-google-docs: *dns
  egress-google-sheets: *dns
  smtp-sink: *dns
  fake-model: *dns
  fake-model-test-port: *dns
  migrate: *dns
  # The `ops` one-shots, which tests/stack/restore-drill.test.ts runs under the gate.
  auth-restore: *dns
  restore-reconcile: *dns
  provision-roles: *dns
  postgres: *dns
  temporal: *dns
  temporal-schema: *dns
  temporal-namespace: *dns
  temporal-test-port: *dns
  valkey: *dns
  objects: *dns
