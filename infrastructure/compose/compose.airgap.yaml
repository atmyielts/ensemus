# Air-gap gate overlay (PLAT-16). Gives networks known addresses so outbound traffic can be counted
# and dropped. DNS points at an unreachable test address (TEST-NET-3), so any lookup of an outside
# name becomes an outbound packet that the gate counts as an attempt.
x-airgap-dns: &dns
  dns: ['203.0.113.53']

services:
  proxy: *dns
  web: *dns
  worker: *dns
  migrate: *dns
  postgres: *dns
  temporal: *dns
  temporal-schema: *dns
  temporal-namespace: *dns
  temporal-test-port: *dns
  valkey: *dns
  objects: *dns

networks:
  edge:
    ipam: { config: [{ subnet: 172.30.1.0/24 }] }
  data:
    ipam: { config: [{ subnet: 172.30.2.0/24 }] }
  temporal:
    ipam: { config: [{ subnet: 172.30.3.0/24 }] }
  temporal-db:
    ipam: { config: [{ subnet: 172.30.4.0/24 }] }
