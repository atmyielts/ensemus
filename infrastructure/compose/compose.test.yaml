# Test overlay: lets tests reach PostgreSQL and Temporal on localhost. Never used in a real
# deployment, where only the proxy is reachable.
services:
  objects:
    ports: ['127.0.0.1:58333:8333']
  postgres:
    ports: ['127.0.0.1:${ENSEMUS_TEST_PG_PORT:-55432}:5432']
    # Lets tests/measure count statements. Nothing else uses it, and no deployment loads it.
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
  # Publishing a port makes Docker accept traffic to that container from other networks, which would
  # undo the web tier's isolation. So tests reach Temporal through this sidecar instead.
  temporal-test-port:
    image: alpine/socat@sha256:466c8a0383e16463fabdb7df01008292fb78d07da60224a46cb5d3142ce122ed
    command: ['tcp-listen:7233,fork,reuseaddr', 'tcp4-connect:temporal:7233']
    networks: [temporal]
    extra_hosts: ['temporal:${ENSEMUS_NETWORK_PREFIX:-172.30}.3.10']
    ports: ['127.0.0.1:57233:7233']
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
  web:
    environment:
      # Most tests sign up through the form. tests/stack/first-owner.test.ts turns it off, as on a
      # default install.
      ENSEMUS_ALLOW_SIGNUP: ${ENSEMUS_ALLOW_SIGNUP:-true}
  # A second replica, for what has to hold across instances (API-13, SEC-12, NEXT-03). Same image,
  # networks and secrets as web. It publishes nothing: tests pick it through the proxy, whose test
  # routing lives in proxy/Caddyfile.test. compose.yaml itself still has one web service.
  web-2:
    extends:
      file: compose.yaml
      service: web
    build: !reset null
    networks: !override
      edge: { ipv4_address: '${ENSEMUS_NETWORK_PREFIX:-172.30}.1.11' }
      data: {}
    environment:
      ENSEMUS_ALLOW_SIGNUP: ${ENSEMUS_ALLOW_SIGNUP:-true}
      ENSEMUS_CONNECTORS_ENABLED: ${ENSEMUS_CONNECTORS_ENABLED:-false}
  proxy:
    extra_hosts: ['web-2:${ENSEMUS_NETWORK_PREFIX:-172.30}.1.11']
    volumes:
      - ./proxy/Caddyfile.test:/etc/caddy/Caddyfile:ro
    depends_on:
      web-2: { condition: service_healthy }
  # A test relay in the place of a real one. No real provider is ever contacted. The sink has no TLS,
  # which is why the worker is told `none` here and nowhere else.
  connector-worker:
    environment:
      ENSEMUS_SMTP_TLS: none
  egress-gateway:
    extra_hosts: ['smtp-sink:${ENSEMUS_NETWORK_PREFIX:-172.30}.6.20']
    environment:
      ENSEMUS_EGRESS_TARGET: smtp-sink:2525
  smtp-sink:
    profiles: ['connectors']
    image: node:24-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
    command: ['node', '/sink/smtp-sink.mjs']
    user: node
    read_only: true
    volumes:
      - ../../tests/helpers/fixtures/smtp-sink.mjs:/sink/smtp-sink.mjs:ro
    networks:
      outbound: { ipv4_address: '${ENSEMUS_NETWORK_PREFIX:-172.30}.6.20' }
    # Control only, for tests: messages it took, and which way to misbehave. SMTP is not published.
    ports: ['127.0.0.1:${ENSEMUS_TEST_SMTP_CONTROL_PORT:-58025}:8025']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8025/stats').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  oidc-mock:
    profiles: ['test-oidc']
    image: ghcr.io/navikt/mock-oauth2-server:2.3.0
    ports: ['127.0.0.1:58080:8080']
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin": false, "tokenCallbacks": [{"issuerId": "default",
        "requestMappings": [{"requestParam": "client_id", "match": "ensemus", "claims": {
        "sub": "sso-user-1", "email": "sso-user@example.invalid", "name": "SSO User",
        "email_verified": true}}]}]}
